<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>경제 수업 퀴즈 · 진단평가 정복하기</title>
<meta name="description" content="1차 수행평가 대비 경제 진단평가 범위를 TESAT 형식 5지선다 30문제로 풀고, 틀린 문제는 비슷한 문제로 다시 도전하는 앱">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2F6FED">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💡%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF4FF; --surface:#FFFFFF; --ink:#14213D; --muted:#5C6B85; --line:#D6E0F0;
  --pri:#2F6FED; --priink:#FFFFFF; --pribg:#E6EEFF; --acc:#F59E0B; --accbg:#FFF4DA;
  --ok:#12805C; --okbg:#E3F6EC; --bad:#C0392B; --badbg:#FDEBE8;
  --shadow:0 10px 30px rgba(31,64,140,.12);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1626; --surface:#16233A; --ink:#E8EEF8; --muted:#9AA8C0; --line:#2A3B58;
    --pri:#6EA0FF; --priink:#0E1626; --pribg:#1B2C4B; --acc:#FBBF24; --accbg:#3A2E10;
    --ok:#4CC38A; --okbg:#12291F; --bad:#FF8A80; --badbg:#34181A;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1626; --surface:#16233A; --ink:#E8EEF8; --muted:#9AA8C0; --line:#2A3B58;
  --pri:#6EA0FF; --priink:#0E1626; --pribg:#1B2C4B; --acc:#FBBF24; --accbg:#3A2E10;
  --ok:#4CC38A; --okbg:#12291F; --bad:#FF8A80; --badbg:#34181A;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.55;-webkit-text-size-adjust:100%}
#app{max-width:780px;margin:0 auto;padding:16px 16px 56px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--pri);outline-offset:2px}

/* ---------- 표지 ---------- */
.hero{border-radius:22px;overflow:hidden;box-shadow:var(--shadow);background:var(--surface);line-height:0}
.hero img{width:100%;height:auto;display:block;aspect-ratio:3/2;object-fit:cover}
.panel{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:22px 20px;margin-top:14px}
h1{font-size:1.5rem;font-weight:900;margin:0 0 6px;letter-spacing:-.02em;word-break:keep-all}
.sub{color:var(--muted);margin:0 0 14px;font-size:.98rem;word-break:keep-all}
.pills{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0 0 14px}
.pills li{background:var(--pribg);color:var(--pri);font-weight:700;font-size:.85rem;padding:5px 12px;border-radius:999px}
.rule{margin:0 0 18px;padding:12px 14px;border-radius:14px;background:var(--accbg);font-size:.9rem;word-break:keep-all}
.rule b{display:block;margin-bottom:2px}
label.lb{display:block;font-weight:700;font-size:.9rem;margin-bottom:6px}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;font:inherit;font-size:1.05rem;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
.field.err input{border-color:var(--bad)}
.field.err{animation:shake .45s}
.hint{min-height:1.3em;margin:6px 2px 0;font-size:.85rem;color:var(--bad)}
.btn{background:var(--pri);color:var(--priink);border:0;border-radius:14px;padding:14px 22px;font-weight:900;font-size:1.05rem;white-space:nowrap;transition:transform .15s,filter .15s}
.btn:active{transform:scale(.97)}
@media (hover:hover){.btn:hover{filter:brightness(1.08)}}
.btn.wide{width:100%;margin-top:16px}
.btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.acc{background:var(--acc);color:#2B1B00}
.resume{width:100%;text-align:left;margin-top:12px;padding:14px 16px;border:1.5px dashed var(--pri);background:var(--pribg);border-radius:14px;display:grid;gap:2px}
.resume b{color:var(--pri)}
.resume span{font-size:.85rem;color:var(--muted)}
.link{background:none;border:0;padding:8px 4px;color:var(--muted);text-decoration:underline;font-size:.85rem}
.center{text-align:center}

/* ---------- 문제 ---------- */
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.chip{font-weight:700;font-size:.8rem;padding:3px 12px;border-radius:999px;background:var(--pribg);color:var(--pri)}
.chip.r{background:var(--acc);color:#2B1B00}
.count{margin-left:auto;font-weight:900;font-variant-numeric:tabular-nums}
.count small{color:var(--muted);font-weight:500}
.mast{display:flex;justify-content:space-between;align-items:baseline;font-size:.82rem;color:var(--muted);margin-bottom:6px}
.mast .count{font-size:1.05rem;color:var(--ink)}
.mast b{color:var(--ok);font-variant-numeric:tabular-nums}
.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--acc));border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:20px 18px}
.qno{display:inline-block;font-weight:900;color:var(--priink);background:var(--pri);padding:2px 12px;border-radius:999px;font-size:.85rem;margin-bottom:10px}
.q{font-size:1.15rem;font-weight:700;line-height:1.6;margin:0 0 14px;letter-spacing:-.01em;word-break:keep-all;white-space:pre-line}
.box{border:1.5px solid var(--ink);border-radius:10px;padding:12px 14px;margin:0 0 14px;background:var(--bg);font-size:.97rem;word-break:keep-all;position:relative}
.box::before{content:"＜보 기＞";display:block;text-align:center;font-weight:900;font-size:.85rem;margin-bottom:6px;letter-spacing:.1em}
.box.plain::before{content:none}
.box div{margin:3px 0}
.tblwrap{overflow-x:auto;margin:0 0 14px;border-radius:12px;border:1.5px solid var(--line)}
.tbl{width:100%;border-collapse:collapse;text-align:center;font-size:.92rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap}
.tbl tr>*:last-child{border-right:0}
.tbl tr:last-child>*{border-bottom:0}
.tbl th{background:var(--pribg);color:var(--pri)}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;min-height:54px;word-break:keep-all;position:relative;transition:background-color .25s,border-color .25s,transform .1s}
.choice .k{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.95rem;font-weight:700;color:var(--muted);line-height:1}
.choice .tx{white-space:pre-line;padding-top:2px}
.choice:active:not(:disabled){transform:scale(.985)}
@media (hover:hover){.choice:not(:disabled):hover{border-color:var(--pri);background:var(--pribg)}}
.choice.ok{border-color:var(--ok);background:var(--okbg)}
.choice.ok .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.choice.bad{border-color:var(--bad);background:var(--badbg)}
.choice.bad .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.choice.dim{opacity:.55}
.fb{margin-top:16px;border-radius:14px;padding:14px 16px;border:1.5px solid}
.fb.ok{border-color:var(--ok);background:var(--okbg)}
.fb.bad{border-color:var(--bad);background:var(--badbg)}
.fb>b{display:block;margin-bottom:4px}
.fb.ok>b{color:var(--ok)}.fb.bad>b{color:var(--bad)}
.fb p{margin:0;font-size:.95rem;word-break:keep-all}
.fb .part{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.fb .part i{display:block;font-style:normal;font-weight:900;font-size:.85rem;margin-bottom:3px}
.fb .part .ans{display:block;color:var(--ok);margin-bottom:3px}
.fb .part.tip{background:var(--accbg);border:0;border-radius:10px;padding:10px 12px}
.fb .again{margin-top:12px;font-size:.88rem;color:var(--muted);word-break:keep-all}

/* ---------- 라운드 안내 / 결과 ---------- */
.cert{background:var(--surface);border:2px solid var(--pri);border-radius:22px;padding:24px 18px;text-align:center;box-shadow:var(--shadow)}
.cert .h{font-weight:700;color:var(--pri)}
.cert .name{font-size:2rem;font-weight:900;margin:6px 0 0;letter-spacing:-.02em}
.cert .msg{color:var(--muted);margin:2px 0 14px;word-break:keep-all}
.cert .score{font-size:3.6rem;font-weight:900;color:var(--pri);line-height:1;font-variant-numeric:tabular-nums}
.cert .score small{font-size:1.1rem;font-weight:700;color:var(--muted)}
.cert .cap{font-size:.82rem;color:var(--muted);margin-top:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 4px}
.stats div{border:1.5px solid var(--line);border-radius:12px;padding:8px}
.stats span{display:block;font-size:.78rem;color:var(--muted)}
.stats b{font-variant-numeric:tabular-nums}
.clock{border:1.5px dashed var(--pri);border-radius:14px;padding:10px 8px;margin-top:10px}
.clock span{display:block;font-size:.78rem;color:var(--muted)}
.clock b{font-size:1.7rem;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock .d{font-size:.9rem;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:6px;animation:pulse 1s infinite}
.chk{width:64px;height:64px;display:block;margin:0 auto 6px;fill:none;stroke:var(--pri);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.sec{margin-top:14px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:18px}
.sec h2{font-size:1.05rem;margin:0 0 12px}
.row{display:grid;grid-template-columns:minmax(96px,34%) 1fr auto;gap:10px;align-items:center;margin:8px 0;font-size:.9rem}
.row .tr{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.row .tr i{display:block;height:100%;background:var(--pri);border-radius:999px}
.row .tr i.full{background:var(--ok)}
.row b{font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{background:var(--badbg);color:var(--bad);font-weight:700;font-size:.85rem;padding:5px 12px;border-radius:999px}
.tag.n{background:var(--pribg);color:var(--pri)}
.actions{display:grid;gap:8px;margin-top:16px}
.allok{text-align:center;color:var(--ok);font-weight:700;padding:6px 0}
.mbar{height:12px;background:var(--line);border-radius:999px;overflow:hidden;margin:6px 0 4px}
.mbar i{display:block;height:100%;background:var(--ok);border-radius:999px}

/* ---------- 애니메이션 ---------- */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes enterR{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes leaveL{to{opacity:0;transform:translateX(-30px)}}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}18%{transform:translateX(-9px)}38%{transform:translateX(8px)}58%{transform:translateX(-5px)}78%{transform:translateX(3px)}}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--ok)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes kpop{from{transform:scale(.2) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
@keyframes certIn{from{opacity:0;transform:scale(.88) translateY(24px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.25}}
.rise{animation:rise .5s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*80ms)}
.qwrap{animation:enterR .35s cubic-bezier(.2,.7,.2,1) backwards}
.qwrap.leave{animation:leaveL .2s ease-in forwards;pointer-events:none}
.choice.ok.picked{animation:pop .5s cubic-bezier(.3,1.5,.5,1),ring .8s ease-out}
.choice.bad.picked{animation:shake .5s}
.choice.ok.late{animation:ring .9s .25s ease-out}
.choice.ok .k,.choice.bad .k{animation:kpop .4s .05s cubic-bezier(.3,1.6,.5,1) backwards}
.fb,.nx{animation:rise .4s .05s cubic-bezier(.2,.7,.2,1) backwards}
.cert{animation:certIn .7s cubic-bezier(.2,1.15,.3,1) backwards}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.fp{position:absolute;display:block;will-change:transform,opacity}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-delay:0s !important;transition-duration:.01ms !important}
}
@media (max-width:520px){
  .tbl{font-size:.78rem}
  .tbl th,.tbl td{padding:7px 3px;white-space:normal;word-break:keep-all;line-height:1.35}
  .tbl tr>*:first-child{padding-left:4px;padding-right:4px}
}
@media (min-width:700px){
  #app{padding-top:28px}
  .panel{padding:28px 30px}
  h1{font-size:1.8rem}
  .card{padding:28px 30px}
  .q{font-size:1.3rem}
  .choice{padding:15px 16px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =====================================================================
   경제 진단평가 정복하기 (TESAT 형식 5지선다)
   - 30개 개념 × 4가지 버전(A~D). 시작 버전은 학생마다 랜덤, 틀리면 다른 버전으로 재출제
   - 1라운드: 30문제 → 틀린 개념만 모아 다음 라운드 → 30개 개념을 모두 맞힐 때까지 반복
   - Q(문제, 보기5개, 정답번호(0~4), 오답사유[틀린 보기 4개 순서대로], 정답해설, 꿀팁, 옵션)
   ===================================================================== */
const SEC = ['희소성·기회비용','수요와 공급','탄력성','가격 규제·세금','외부효과·공공재','GDP·물가·실업'];
const NUM = ['①','②','③','④','⑤'];

function Q(q, c, a, w, e, tip, o){
  const full = []; let k = 0;
  for(let i = 0; i < c.length; i++){ full.push(i === a ? '' : (w[k++] || '')); }
  return Object.assign({q, c, a, w:full, e, tip}, o || {});
}

const BANK = [
/* ───────── 1. 희소성·기회비용 ───────── */
{s:0, t:'희소성',
 A:Q('경제학에서 말하는 ‘희소성’에 대한 설명으로 가장 적절한 것은?',
  ['물건의 가격이 매우 비싸다는 뜻이다.','자원이 사라져 더 이상 구할 수 없다는 뜻이다.','사람들의 욕구에 비해 이를 충족시킬 자원이 상대적으로 부족하다는 뜻이다.','생산량이 줄어들 때에만 나타나는 현상이다.','가난한 나라에서만 나타나는 문제이다.'], 2,
  ['값이 비싼 것과는 달라요. 공기처럼 공짜여도, 비싸도 희소성과는 별개예요.','자원이 “없어지는” 게 아니에요. 있어도 욕구보다 모자라면 희소해요.','희소성은 생산량이 줄 때만이 아니라 언제나 있어요.','부자 나라든 가난한 나라든 모두에게 있는 문제예요.'],
  '희소성은 “갖고 싶은 건 많은데 쓸 수 있는 자원은 모자라는 상태”예요. 그래서 우리는 늘 무언가를 선택해야 해요.',
  '희소성 = 욕구 > 자원 (상대적 부족)'),
 B:Q('다음 중 희소성이 있는 상황으로 가장 적절한 것은?',
  ['사람들이 원하는 만큼 마음껏 쓸 수 있는 공기','용돈은 한정되어 있는데 사고 싶은 물건은 여러 개라 고민하는 상황','가격이 내려가서 판매량이 늘어난 상황','정부가 세금을 걷는 상황','물건이 너무 흔해서 아무도 사지 않는 상황'], 1,
  ['마음껏 쓸 수 있는 자원은 모자라지 않아서 희소하지 않아요.','가격이 내려 판매량이 느는 건 수요 법칙 이야기예요. 희소성과는 달라요.','세금은 정부 재정 이야기예요. 욕구와 자원의 부족과는 관계가 없어요.','너무 흔하면 자원이 충분하다는 뜻이라 희소성과 반대예요.'],
  '욕구는 많은데 자원(용돈)이 한정되어 “무엇을 고를지” 고민한다면 희소성이 있는 상황이에요.',
  '고민하며 골라야 한다면 → 희소성!')},

{s:0, t:'기회비용',
 A:Q('다음 중 ‘기회비용’에 대한 설명으로 가장 적절한 것은?',
  ['선택하여 얻게 되는 이익의 크기','선택한 대안을 위해 실제로 지출한 금액만을 뜻하는 것','어떤 선택을 함으로써 포기하게 되는 것 중 가장 가치가 큰 것','이미 지출하여 다시 돌려받을 수 없는 비용','선택하지 않은 모든 대안의 가치를 합한 것'], 2,
  ['얻는 것은 “편익(이익)”이에요. 기회비용은 반대로 “포기한 것”이에요.','실제로 낸 돈(명시적 비용)뿐 아니라 포기한 가치(암묵적 비용)까지 포함해요.','그건 매몰비용이에요. 이미 써서 못 돌려받는 비용은 기회비용과 달라요.','포기한 걸 “전부 더한” 게 아니라 “그중 가장 가치가 큰 것 하나”예요.'],
  '기회비용은 선택하면서 포기한 것 중 가장 큰 가치예요. 포기한 것 중 1등 하나만 센다는 점이 포인트예요.',
  '기회비용 = 포기한 것 중 “최고 가치 1개”. 다 더하지 않아요!'),
 B:Q('민수는 토요일 오후에 (가) 아르바이트(5만 원 수입), (나) 친구와 영화 보기(3만 원 가치), (다) 집에서 쉬기(1만 원 가치) 중 하나만 할 수 있어서 (나)를 선택했다.\n민수가 영화를 선택한 기회비용은?',
  ['1만 원','3만 원','5만 원','6만 원','9만 원'], 2,
  ['쉬기(1만 원)는 포기한 것 중 가장 큰 가치가 아니에요.','3만 원은 영화에서 “얻는” 가치예요. 기회비용은 포기한 것의 가치예요.','포기한 두 개(5만+1만)를 더했어요. 기회비용은 가장 큰 것 하나만이에요.','선택한 영화(3만 원)까지 합쳤어요. 선택한 것은 기회비용에 넣지 않아요.'],
  '영화를 고르면서 포기한 것은 아르바이트(5만 원)와 쉬기(1만 원)예요. 이 중 가장 가치가 큰 아르바이트 5만 원이 기회비용이에요.',
  '선택한 것은 빼고, 포기한 것 중 “최고” 하나!')},

{s:0, t:'명시적·암묵적 비용',
 A:Q('정현이는 연봉 3,600만 원을 받던 회사를 그만두고 카페를 창업하였다.\n다음 중 정현이의 카페 창업에서 ‘암묵적 비용’에 해당하는 것은?',
  ['커피 원두 구입비','아르바이트생에게 지급한 인건비','전기·수도 요금','회사를 그만두어 포기하게 된 연봉','카페 홍보 전단지 제작비'], 3,
  ['원두값은 실제로 돈이 나간 “명시적 비용”이에요.','인건비는 실제로 돈을 낸 “명시적 비용”이에요.','요금도 실제로 돈이 나가니 “명시적 비용”이에요.','전단지 제작비도 돈을 낸 “명시적 비용”이에요.'],
  '암묵적 비용은 “돈은 안 냈지만 포기한 가치”예요. 회사를 그만두며 포기한 연봉이 딱 그거예요.',
  '눈에 보이는 지출 = 명시적, 포기한 수입 = 암묵적'),
 B:Q('치킨집 사장님은 자기 소유 건물에서 장사를 한다. 같은 건물을 남에게 빌려주면 월세 300만 원을 받을 수 있다.\n다음 중 사장님의 ‘암묵적 비용’은?',
  ['닭고기 구입비','직원에게 주는 월급','포기한 월세 수입 300만 원','배달 앱 수수료','가스 요금'], 2,
  ['닭고기값은 실제로 돈이 나가는 명시적 비용이에요.','월급도 실제로 지급하니 명시적 비용이에요.','수수료도 실제로 내는 돈이라 명시적 비용이에요.','가스 요금도 실제 지출이라 명시적 비용이에요.'],
  '내 건물이라 월세를 내진 않지만, 남에게 빌려줬다면 받았을 300만 원을 포기한 거예요. 이게 암묵적 비용이에요.',
  '내 것을 쓰는 것도 공짜가 아니에요. 남에게 줬다면 얻었을 몫이 비용!')},

{s:0, t:'기회비용 계산',
 A:Q('시윤이는 토요일 오후 4시간을 어떻게 보낼지 고민하다가 편의점 아르바이트 대신 유료 특강을 듣기로 했다. 특강 수강료는 30,000원이고, 아르바이트는 시급 10,000원으로 4시간 일할 수 있다.\n(기회비용 = 명시적 비용 + 암묵적 비용)\n특강을 선택한 시윤이의 기회비용은?',
  ['10,000원','30,000원','40,000원','70,000원','100,000원'], 3,
  ['10,000원은 시급 한 시간치예요. 4시간이면 4만 원이고, 수강료도 더해야 해요.','수강료 30,000원은 눈에 보이는 “명시적 비용”만이에요. 포기한 알바 수입도 더해요.','40,000원은 포기한 알바 수입(암묵적 비용)만이에요. 수강료 3만 원도 더해요.','이미 구한 70,000원에 또 3만 원을 더한 것 같아요. 한 번씩만 더해요.'],
  '명시적 비용 30,000원(수강료) + 암묵적 비용 40,000원(포기한 알바 수입 10,000원×4시간) = 70,000원이에요.',
  '기회비용 = 낸 돈 + 포기한 수입'),
 B:Q('지민이는 일요일 3시간 동안 아르바이트(시급 12,000원) 대신 20,000원짜리 코딩 특강을 듣기로 했다.\n(기회비용 = 명시적 비용 + 암묵적 비용)\n특강을 선택한 지민이의 기회비용은?',
  ['20,000원','32,000원','36,000원','56,000원','76,000원'], 3,
  ['20,000원은 수강료(명시적 비용)뿐이에요. 포기한 알바 수입도 더해요.','32,000원은 수강료와 시급 12,000원을 더했어요. 알바는 3시간이라 36,000원이에요.','36,000원은 포기한 알바 수입(암묵적 비용)만이에요. 수강료도 더해요.','76,000원은 20,000원을 한 번 더 더한 값이에요. 한 번씩만 더해요.'],
  '수강료 20,000원 + 포기한 알바 수입 36,000원(12,000원×3시간) = 56,000원이에요.',
  '기회비용 = 낸 돈 + 포기한 수입')},

{s:0, t:'매몰비용',
 A:Q('소연이는 영화 예매비 15,000원을 이미 결제했고 환불은 불가능하다. 영화가 시작된 지 30분이 지났는데 매우 재미가 없고, 남은 시간에 친구와 카페에서 이야기하는 편이 더 즐거울 것 같다.\n이때 소연이의 합리적인 판단으로 가장 적절한 것은?',
  ['이미 낸 15,000원이 아까우므로 끝까지 영화를 보아야 한다.','이미 낸 15,000원은 되돌릴 수 없으므로 고려하지 않고, 앞으로 얻을 만족과 포기해야 할 대안의 가치만 비교해야 한다.','15,000원은 기회비용이므로 영화를 계속 보는 선택의 비용에 반드시 포함해야 한다.','영화를 중간에 나가면 15,000원을 손해 보므로 나가는 것이 항상 합리적이다.','15,000원을 돌려받을 수 있을 때에만 합리적인 선택을 할 수 있다.'], 1,
  ['이미 낸 돈은 어차피 못 돌려받아요. “아까워서”는 합리적인 이유가 아니에요.','이미 낸 돈은 기회비용이 아니라 “매몰비용”이에요. 앞으로의 선택에는 넣지 않아요.','나가도, 남아도 15,000원은 돌아오지 않아요. 그래서 “항상 합리적”이라고 할 수 없어요.','환불이 안 되는 상황에서도 합리적 선택은 할 수 있어요. 앞으로의 득실만 비교하면 돼요.'],
  '이미 낸 15,000원은 어떤 선택을 해도 돌아오지 않는 매몰비용이에요. 그래서 “앞으로 얻을 만족”과 “포기해야 할 것”만 비교해요.',
  '이미 쓴 돈(매몰비용)은 잊고, 앞으로만 계산!'),
 B:Q('소연이는 환불이 불가능한 조건으로 학원 한 달 수강료 200,000원을 결제했다. 2주 다녀 보니 강의가 도움이 안 되고 혼자 공부하는 편이 훨씬 효과적이다. 그런데 소연이는 “이미 낸 20만 원이 아까워서 끝까지 다녀야 해.”라고 말한다.\n소연이의 선택에 대한 설명으로 가장 적절한 것은?',
  ['20만 원은 이미 냈으니, 아까워서라도 끝까지 다녀야 합리적이다.','20만 원은 매몰비용이므로 앞으로의 선택을 판단할 때 빼고 생각해야 한다.','20만 원은 기회비용이므로 그만두는 선택의 비용에 반드시 포함해야 한다.','그만두면 20만 원이 모두 손해이므로 그만두는 선택은 항상 잘못이다.','20만 원을 돌려받아야만 그만둘 수 있다.'], 1,
  ['아까운 마음은 이해되지만, 낸 돈은 어차피 돌아오지 않아요. 앞으로 도움이 되는지가 중요해요.','이미 낸 돈은 기회비용이 아니라 매몰비용이에요.','앞으로 얻을 이익이 더 크다면 그만두는 게 더 나은 선택일 수 있어요.','환불이 안 되어도 합리적 선택을 할 수 있어요. 돌려받아야만 하는 건 아니에요.'],
  '20만 원은 이미 써서 돌아오지 않는 매몰비용이에요. 앞으로 시간을 어디에 쓰는 게 더 이득인지만 비교하면 돼요.',
  '이미 쓴 돈(매몰비용)은 잊고, 앞으로만 계산!')},

/* ───────── 2. 수요와 공급 ───────── */
{s:1, t:'수요량 vs 수요의 변화',
 A:Q('아이스크림 시장에서 수요곡선 자체는 이동하지 않고 수요곡선 위에서의 이동(수요량의 변화)에 해당하는 것만을 있는 대로 고른 것은?\n(단, 다른 조건은 일정하다.)',
  ['ㄱ','ㄴ, ㄷ','ㄱ, ㄷ','ㄴ, ㄹ','ㄱ, ㄹ'], 4,
  ['ㄱ은 맞아요! 그런데 ㄹ도 “가격” 때문에 구매량이 변했어요. 하나 더 있어요.','ㄴ(폭염), ㄷ(소득)은 가격이 아닌 이유라 수요곡선이 이동하는 “수요의 변화”예요.','ㄷ은 소득 때문이라 수요곡선이 이동해요. 가격 때문인 ㄱ과 ㄹ을 골라야 해요.','ㄴ(폭염)은 가격이 아닌 이유예요. 수요의 변화니까 빼야 해요.'],
  '“가격” 때문에 사는 양이 달라지면 수요량의 변화(곡선 위 이동)예요. 가격이 아닌 이유(날씨, 소득, 유행 등)라면 수요의 변화(곡선 이동)예요. ㄱ, ㄹ만 가격 때문이에요.',
  '“가격이 올라/내려서”가 있으면 → 수요량의 변화',
  {fix:true, box:['ㄱ. 아이스크림 가격이 2,000원에서 3,000원으로 올라 구매량이 줄었다.','ㄴ. 폭염이 계속되어 같은 가격에서도 아이스크림을 더 사려는 사람이 늘었다.','ㄷ. 소비자의 소득이 늘어 같은 가격에서도 아이스크림을 더 사려고 한다.','ㄹ. 아이스크림 가격이 1,500원으로 내려 구매량이 늘었다.']}),
 B:Q('피자 시장에 대한 설명이다. 수요곡선 자체가 이동하는 것(수요의 변화)만을 있는 대로 고른 것은?\n(단, 다른 조건은 일정하다.)',
  ['ㄱ, ㄷ','ㄴ, ㄹ','ㄱ, ㄴ','ㄷ, ㄹ','ㄱ, ㄴ, ㄹ'], 1,
  ['ㄱ, ㄷ은 “가격” 때문에 판매량이 변했어요. 곡선 위에서 움직이는 수요량의 변화예요.','ㄱ은 가격 때문에 변한 수요량의 변화예요. 곡선 자체가 움직이는 건 ㄴ, ㄹ이에요.','ㄷ은 가격 때문이라 수요량의 변화예요. ㄴ과 ㄹ을 골라야 해요.','ㄱ은 가격 때문이라 빼야 해요.'],
  '가격은 그대로인데 유행(ㄴ), 소비자 수(ㄹ) 때문에 사려는 양이 달라졌다면 수요곡선이 통째로 이동해요.',
  '가격 때문이면 “수요량”, 다른 이유면 “수요”',
  {fix:true, box:['ㄱ. 피자 가격이 올라 판매량이 줄었다.','ㄴ. 피자가 유행하여 같은 가격에서도 사려는 사람이 늘었다.','ㄷ. 피자 가격이 내려 판매량이 늘었다.','ㄹ. 소비자 수가 늘어 같은 가격에서도 더 많이 팔린다.']})},

{s:1, t:'수요 변화 요인',
 A:Q('다음 중 햄버거 수요곡선을 오른쪽으로 이동시키는 요인(수요 증가 요인)만을 있는 대로 고른 것은?\n(단, 햄버거는 정상재이며, 다른 조건은 일정하다.)',
  ['ㄱ, ㄴ','ㄱ, ㄹ','ㄱ, ㄴ, ㄷ','ㄴ, ㄷ, ㄹ','ㄱ, ㄴ, ㄷ, ㄹ'], 2,
  ['ㄱ, ㄴ은 맞아요! 그런데 ㄷ(소비자 수 증가)도 수요를 늘려서 빠졌어요.','ㄹ은 햄버거 “자기 가격”이 내린 거라 곡선 위에서 수요량이 느는 거예요. 곡선 이동이 아니에요.','ㄱ(소득 증가)이 빠졌고, ㄹ은 자기 가격 변화라 곡선을 이동시키지 않아요.','ㄹ까지 넣으면 틀려요. 자기 가격 하락은 수요량 증가예요.'],
  '정상재는 소득이 늘면 수요 증가, 대체재 가격이 오르면 수요 증가, 소비자 수가 늘면 수요 증가예요. 자기 가격 하락은 곡선 위 이동이에요.',
  '자기 가격만 빼고, 소득·대체재·인구·취향이 곡선을 움직여요',
  {fix:true, box:['ㄱ. 소비자의 소득 증가','ㄴ. 대체재인 치킨 가격의 상승','ㄷ. 햄버거를 사려는 소비자 수의 증가','ㄹ. 햄버거 가격의 하락']}),
 B:Q('다음 중 커피 수요곡선을 왼쪽으로 이동시키는 요인(수요 감소 요인)만을 있는 대로 고른 것은?\n(단, 커피는 정상재이며, 다른 조건은 일정하다.)',
  ['ㄱ, ㄴ','ㄱ, ㄴ, ㄹ','ㄴ, ㄷ','ㄷ, ㄹ','ㄱ, ㄴ, ㄷ, ㄹ'], 1,
  ['ㄱ, ㄴ은 맞아요. 하지만 ㄹ(선호 하락)도 수요를 줄여서 하나 더 있어요.','ㄷ은 커피 자기 가격이 내린 거라 수요량이 늘 뿐 곡선은 이동하지 않아요.','ㄷ은 자기 가격 변화라 빼야 하고, ㄱ·ㄹ이 빠졌어요.','ㄷ(자기 가격 하락)은 곡선 이동 요인이 아니에요.'],
  '정상재는 소득이 줄면 수요 감소, 보완재 가격이 오르면 같이 쓰는 커피 수요도 감소, 선호가 떨어져도 수요 감소예요. 자기 가격 변화는 곡선 위 이동이에요.',
  '보완재(짝꿍) 가격이 오르면 → 내 수요는 감소',
  {fix:true, box:['ㄱ. 소비자의 소득 감소','ㄴ. 커피의 보완재인 커피 시럽 가격의 상승','ㄷ. 커피 가격의 하락','ㄹ. 커피가 건강에 해롭다는 보도로 인한 선호 하락']})},

{s:1, t:'공급 감소 요인',
 A:Q('다음 중 치킨 시장에서 공급의 감소에 해당하는 것은?\n(단, 다른 조건은 일정하다.)',
  ['치킨 가격이 하락하여 치킨집들이 판매량을 줄였다.','닭고기 가격이 크게 올라, 같은 치킨 가격에서 팔려는 양이 줄었다.','치킨 가격이 올라 치킨집들이 더 많이 팔려고 한다.','튀김 기계 성능이 좋아져 같은 비용으로 더 많은 치킨을 만들 수 있게 되었다.','치킨을 사려는 사람이 늘어났다.'], 1,
  ['가격이 내려 판매량이 줄어든 건 곡선 위에서 움직이는 “공급량의 감소”예요. 공급 감소는 곡선 자체의 이동이에요.','','가격이 올라 더 팔려는 건 공급량 증가(곡선 위 이동)예요.','기술이 좋아지면 같은 비용으로 더 만들 수 있어 공급이 “증가”해요.','사려는 사람이 늘면 “수요” 쪽 이야기예요.'].filter(Boolean),
  '재료값이 오르면 만드는 비용이 늘어서, 같은 가격에서도 팔려는 양이 줄어요. 공급곡선이 왼쪽으로 이동하는 “공급 감소”예요.',
  '재료값↑ · 기술 후퇴 · 세금↑ → 공급 감소'),
 B:Q('다음 중 빵 시장에서 공급곡선을 왼쪽으로 이동시키는 요인(공급 감소 요인)은?\n(단, 다른 조건은 일정하다.)',
  ['밀가루 가격의 상승','빵 가격의 상승','제빵 기술의 발전','빵집 수의 증가','빵을 좋아하는 소비자의 증가'], 0,
  ['빵 자체 가격이 오르면 곡선 위에서 공급량이 늘어요. 곡선 이동이 아니에요.','기술이 발전하면 비용이 줄어 공급이 증가(오른쪽 이동)해요.','빵집이 늘면 전체 공급이 증가해요.','소비자가 늘면 수요 쪽 요인이에요.'],
  '밀가루는 빵의 재료예요. 재료값이 오르면 만드는 비용이 늘어 공급이 감소해요.',
  '재료값↑ · 기술 후퇴 · 세금↑ → 공급 감소')},

{s:1, t:'대체재·보완재와 균형',
 A:Q('커피와 홍차는 서로 대체재 관계이다. 커피 가격이 크게 하락하였을 때, 홍차 시장에서 나타날 변화로 가장 적절한 것은?\n(단, 홍차의 공급은 변하지 않는다.)',
  ['홍차의 수요 감소 → 균형가격 하락, 균형거래량 감소','홍차의 수요 증가 → 균형가격 상승, 균형거래량 증가','홍차의 수요량 감소 → 균형가격 하락, 균형거래량 감소','홍차의 공급 감소 → 균형가격 상승, 균형거래량 감소','홍차의 수요 감소 → 균형가격 상승, 균형거래량 감소'], 0,
  ['커피가 싸지면 사람들이 커피로 옮겨 가서 홍차 수요는 “감소”해요. 증가가 아니에요.','홍차 가격 때문이 아니라 커피 가격 때문이라 “수요량”이 아니라 “수요”가 변해요.','커피 가격은 홍차를 만드는 쪽(공급)과 상관없어요. 공급은 그대로예요.','수요가 줄면 가격은 오르는 게 아니라 내려가요. 방향을 다시 확인해 봐요.'],
  '대체재 가격이 내리면 홍차 수요가 감소(왼쪽 이동)해서, 균형가격은 하락하고 균형거래량도 감소해요.',
  '수요 감소 → 가격↓ 거래량↓ / 수요 증가 → 가격↑ 거래량↑'),
 B:Q('프린터와 잉크는 함께 쓰는 보완재 관계이다. 잉크 가격이 크게 올랐을 때 프린터 시장에서 나타날 변화로 가장 적절한 것은?\n(단, 프린터의 공급은 변하지 않는다.)',
  ['프린터의 수요 증가 → 균형가격 상승, 균형거래량 증가','프린터의 수요 감소 → 균형가격 하락, 균형거래량 감소','프린터의 수요 감소 → 균형가격 상승, 균형거래량 감소','프린터의 공급 감소 → 균형가격 상승, 균형거래량 감소','프린터의 수요량 증가 → 균형가격 하락, 균형거래량 증가'], 1,
  ['보완재는 짝꿍이에요. 잉크가 비싸지면 프린터도 덜 사서 수요는 “감소”해요.','수요가 줄면 가격은 상승이 아니라 하락해요.','잉크 가격은 프린터를 만드는 쪽(공급)에 영향을 주지 않아요.','프린터 자체 가격이 바뀐 게 아니라서 “수요량”이 아니라 “수요”가 변해요.'],
  '잉크가 비싸지면 프린터를 사려는 사람이 줄어 수요가 감소해요. 수요 감소 → 균형가격 하락, 균형거래량 감소예요.',
  '보완재는 한쪽 가격↑ → 다른 쪽 수요↓')},

{s:1, t:'공급 변화와 균형',
 A:Q('라면 공장이 자동화 설비를 도입하여 라면 생산비가 크게 낮아졌다. 라면 시장에서 나타날 변화로 옳은 것은?\n(단, 소비자의 수요는 변하지 않는다.)',
  ['수요 증가 → 균형가격 상승, 균형거래량 증가','수요 감소 → 균형가격 하락, 균형거래량 감소','공급 감소 → 균형가격 상승, 균형거래량 감소','공급 증가 → 균형가격 하락, 균형거래량 증가','공급 증가 → 균형가격 하락, 균형거래량 감소'], 3,
  ['소비자 수요는 변하지 않는다고 했어요. 바뀐 건 생산비(공급)예요.','수요는 그대로예요. 생산비가 줄었으니 공급 쪽 변화예요.','생산비가 줄면 공급이 “증가”해요. 감소가 아니에요.','공급이 증가하면 가격은 내려가고 거래량은 “증가”해요. 거래량 방향이 달라요.'],
  '생산비가 줄면 같은 가격에서 더 많이 팔 수 있어 공급이 증가해요. 공급곡선이 오른쪽으로 가면 가격은 내려가고 거래량은 늘어요.',
  '공급 증가: 가격↓ 거래량↑'),
 B:Q('흉년으로 쌀 생산량이 크게 줄었다. 쌀 시장에서 나타날 변화로 옳은 것은?\n(단, 소비자의 수요는 변하지 않는다.)',
  ['공급 증가 → 균형가격 하락, 균형거래량 증가','공급 감소 → 균형가격 상승, 균형거래량 감소','수요 감소 → 균형가격 하락, 균형거래량 감소','공급 감소 → 균형가격 하락, 균형거래량 증가','수요 증가 → 균형가격 상승, 균형거래량 증가'], 1,
  ['흉년이면 생산이 줄어 공급은 증가가 아니라 감소예요.','수요는 그대로예요. 바뀐 건 생산량(공급)이에요.','공급이 줄면 가격은 내려가는 게 아니라 올라가고, 거래량은 줄어요.','수요는 변하지 않는다고 했어요. 공급이 감소한 거예요.'],
  '흉년으로 공급이 감소하면 공급곡선이 왼쪽으로 이동해요. 그러면 가격은 오르고 거래량은 줄어요.',
  '공급 감소: 가격↑ 거래량↓')},

{s:1, t:'균형가격 계산',
 A:Q('학교 앞 편의점 삼각김밥 시장의 수요함수와 공급함수가 다음과 같다. (P: 가격(백 원), Q: 수량(개))\n수요함수 Qd = 100 − 2P\n공급함수 Qs = 20 + 2P\n균형가격(P)과 균형거래량(Q)은?',
  ['P = 10, Q = 80','P = 15, Q = 70','P = 20, Q = 60','P = 25, Q = 50','P = 30, Q = 40'], 2,
  ['P=10이면 수요량은 80개, 공급량은 40개로 달라요. 균형이 아니에요.','P=15이면 수요량 70개, 공급량 50개로 아직 같지 않아요.','P=25이면 수요량 50개, 공급량 70개로 달라요.','P=30이면 수요량 40개, 공급량 80개로 달라요.'],
  '균형은 Qd = Qs일 때예요. 100 − 2P = 20 + 2P → 80 = 4P → P = 20. 그러면 Q = 100 − 40 = 60개예요.',
  'Qd = Qs 로 놓고 P를 먼저! 그다음 Q'),
 B:Q('겨울철 붕어빵 시장의 수요함수와 공급함수가 다음과 같다. (P: 가격(백 원), Q: 수량(개))\n수요함수 Qd = 80 − 3P\n공급함수 Qs = 10 + 4P\n균형가격(P)과 균형거래량(Q)은?',
  ['P = 5, Q = 65','P = 8, Q = 56','P = 10, Q = 50','P = 12, Q = 44','P = 14, Q = 38'], 2,
  ['P=5이면 수요량은 65개, 공급량은 30개로 달라요.','P=8이면 수요량 56개, 공급량 42개로 아직 같지 않아요.','P=12이면 수요량 44개, 공급량 58개로 달라요.','P=14이면 수요량 38개, 공급량 66개로 달라요.'],
  '80 − 3P = 10 + 4P → 70 = 7P → P = 10. 그러면 Q = 80 − 30 = 50개예요.',
  'Qd = Qs 로 놓고 P를 먼저! 그다음 Q')},

{s:1, t:'초과수요·초과공급 찾기',
 A:Q('다음은 쌀 시장의 가격에 따른 수요량과 공급량이다. 쌀 가격이 kg당 2,000원일 때 시장에서 나타나는 현상으로 옳은 것은?',
  ['초과수요 40톤이 발생한다.','초과수요 20톤이 발생한다.','초과공급 40톤이 발생한다.','초과공급 20톤이 발생한다.','시장균형이 그대로 유지된다.'], 0,
  ['2,000원에서 수요 70, 공급 30이라 차이는 20이 아니라 40이에요.','수요(70)가 공급(30)보다 많으니 “초과수요”예요. 초과공급이 아니에요.','수요가 더 많으니 초과수요예요. 차이도 40이에요.','균형가격은 3,000원이에요. 2,000원에서는 균형이 아니에요.'],
  '2,000원일 때 사려는 양은 70톤, 팔려는 양은 30톤이에요. 사려는 양이 40톤 더 많은 “초과수요”예요.',
  '수요량 > 공급량 → 초과수요(부족) / 수요량 < 공급량 → 초과공급(남음)',
  {table:{head:['가격(원/kg)','1,000','2,000','3,000','4,000','5,000'], rows:[['수요량(톤)','90','70','50','30','10'],['공급량(톤)','10','30','50','70','90']]}}),
 B:Q('다음은 치킨 시장의 가격에 따른 수요량과 공급량이다. 치킨 가격이 16천 원일 때 시장에서 나타나는 현상으로 옳은 것은?',
  ['초과수요 30개가 발생한다.','초과수요 10개가 발생한다.','초과공급 30개가 발생한다.','초과공급 10개가 발생한다.','시장균형이 그대로 유지된다.'], 2,
  ['16천 원에서 수요 50, 공급 80이에요. 공급이 더 많으니 초과“공급”이에요.','공급이 더 많으니 초과공급이고, 차이는 10이 아니라 30이에요.','초과공급은 맞지만 차이는 80 − 50 = 30이에요.','균형가격은 14천 원이에요. 16천 원에서는 균형이 아니에요.'],
  '16천 원일 때 사려는 양은 50개, 팔려는 양은 80개예요. 팔려는 양이 30개 더 많아서 “초과공급”이에요.',
  '수요량 > 공급량 → 초과수요(부족) / 수요량 < 공급량 → 초과공급(남음)',
  {table:{head:['가격(천 원)','10','12','14','16','18'], rows:[['수요량(개)','80','70','60','50','40'],['공급량(개)','20','40','60','80','100']]}})},

{s:1, t:'수요(공급) 변화 후 균형',
 A:Q('어느 카페의 아메리카노 시장의 수요함수와 공급함수가 다음과 같았다. (P: 가격(백 원), Q: 수량(잔))\n수요함수 Qd = 90 − 3P\n공급함수 Qs = 10 + 2P\n소비자의 소득이 증가하여 수요함수가 Qd = 115 − 3P로 바뀌었다. (공급함수는 변하지 않았다.)\n소득 증가 후의 균형가격(P)과 균형거래량(Q)은?',
  ['P = 16, Q = 42','P = 18, Q = 46','P = 21, Q = 52','P = 24, Q = 43','P = 25, Q = 40'], 2,
  ['(16, 42)는 소득이 늘기 “전”의 균형이에요. 바뀐 수요함수로 다시 계산해야 해요.','P=18이면 수요량은 61잔, 공급량은 46잔으로 달라요.','P=24이면 수요량 43잔, 공급량 58잔으로 달라요.','P=25이면 수요량 40잔, 공급량 60잔으로 달라요.'],
  '새 수요함수와 공급함수를 같게 놓아요. 115 − 3P = 10 + 2P → 105 = 5P → P = 21, Q = 10 + 42 = 52잔이에요. 수요가 늘어서 가격(16→21)도 거래량(42→52)도 늘었어요.',
  '수요 증가면 가격과 거래량이 둘 다 늘어야 해요. 계산 후 방향도 확인!'),
 B:Q('어느 지역 귤 시장의 수요함수와 공급함수가 다음과 같았다. (P: 가격(백 원), Q: 수량(상자))\n수요함수 Qd = 70 − 2P\n공급함수 Qs = 10 + 3P\n풍년으로 공급이 증가하여 공급함수가 Qs = 30 + 3P로 바뀌었다. (수요함수는 변하지 않았다.)\n공급 증가 후의 균형가격(P)과 균형거래량(Q)은?',
  ['P = 8, Q = 54','P = 12, Q = 46','P = 10, Q = 50','P = 6, Q = 58','P = 14, Q = 42'], 0,
  ['(12, 46)은 공급이 늘기 “전”의 균형이에요. 바뀐 공급함수로 다시 계산해야 해요.','P=10이면 수요량은 50상자, 공급량은 60상자로 달라요.','P=6이면 수요량 58상자, 공급량 48상자로 달라요.','P=14이면 수요량 42상자, 공급량 72상자로 달라요.'],
  '70 − 2P = 30 + 3P → 40 = 5P → P = 8, Q = 70 − 16 = 54상자예요. 공급이 늘어서 가격은 12→8로 내리고, 거래량은 46→54로 늘었어요.',
  '공급 증가면 가격↓ 거래량↑. 계산 후 방향도 확인!')},

/* ───────── 3. 탄력성 ───────── */
{s:2, t:'가격탄력성의 뜻',
 A:Q('다음 중 수요의 가격탄력성에 대한 설명으로 옳은 것은?',
  ['탄력성이 1보다 크면 가격 변화율보다 수요량 변화율이 더 작다.','가격이 변해도 수요량이 거의 변하지 않으면 탄력적 수요이다.','가격의 변화율을 수요량의 변화율로 나눈 값의 절댓값으로 구한다.','탄력성이 1보다 작을수록 소비자는 가격 변화에 더 민감하게 반응한다.','수요량의 변화율을 가격의 변화율로 나눈 값의 절댓값으로 구한다.'], 4,
  ['탄력성이 1보다 크면 가격 변화율보다 수요량 변화율이 “더 커요”.','가격이 변해도 수요량이 거의 안 변하면 “비탄력적” 수요예요.','식이 거꾸로예요. 수요량 변화율 ÷ 가격 변화율이에요.','탄력성이 1보다 작을수록 가격 변화에 “덜” 민감해요.'],
  '수요의 가격탄력성 = 수요량 변화율 ÷ 가격 변화율(절댓값)이에요. 클수록 가격에 민감하게 반응해요.',
  '탄력성 = 수량 ÷ 가격 (수량이 위!)'),
 B:Q('다음 중 수요가 비탄력적인 경우(탄력성이 1보다 작은 경우)로 가장 적절한 것은?',
  ['가격이 10% 올랐더니 수요량이 30% 줄었다.','가격이 10% 올랐더니 수요량이 2% 줄었다.','가격이 5% 내렸더니 수요량이 15% 늘었다.','가격이 20% 올랐더니 수요량이 40% 줄었다.','가격이 1% 올랐더니 수요량이 5% 줄었다.'], 1,
  ['수량 30% ÷ 가격 10% = 3이라 탄력적이에요.','','수량 15% ÷ 가격 5% = 3이라 탄력적이에요.','수량 40% ÷ 가격 20% = 2라서 탄력적이에요.','수량 5% ÷ 가격 1% = 5라서 매우 탄력적이에요.'].filter(Boolean),
  '2% ÷ 10% = 0.2로 1보다 작아요. 가격이 올라도 수요량이 별로 안 변하니 비탄력적이에요.',
  '계산 결과가 1보다 크면 탄력적, 작으면 비탄력적')},

{s:2, t:'탄력성 계산과 총수입',
 A:Q('편의점에서 도시락 가격을 2,000원에서 2,200원으로 올렸더니 하루 판매량이 100개에서 80개로 줄었다.\n수요의 가격탄력성과 총수입의 변화로 옳은 것은?',
  ['탄력성 0.5(비탄력적), 총수입 증가','탄력성 0.5(비탄력적), 총수입 감소','탄력성 2(탄력적), 총수입 증가','탄력성 2(탄력적), 총수입 감소','탄력성 1(단위탄력적), 총수입 변화 없음'], 3,
  ['탄력성이 거꾸로예요. 수량 변화율 20% ÷ 가격 변화율 10% = 2예요.','탄력성이 거꾸로 계산됐어요. 20 ÷ 10 = 2예요.','탄력성 2는 맞아요! 그런데 탄력적일 때 가격을 올리면 총수입은 줄어요. (200,000원 → 176,000원)','가격 변화율은 10%, 수량 변화율은 20%로 서로 달라요. 1이 아니에요.'],
  '가격 변화율 = 200 ÷ 2,000 = 10%, 수량 변화율 = 20 ÷ 100 = 20%라서 탄력성 = 20 ÷ 10 = 2(탄력적)예요. 총수입은 2,000×100 = 200,000원에서 2,200×80 = 176,000원으로 줄어요.',
  '탄력적일 땐 가격을 올리면 총수입↓, 내리면 ↑'),
 B:Q('마트에서 과자 가격을 1,000원에서 1,200원으로 올렸더니 하루 판매량이 100개에서 95개로 줄었다.\n수요의 가격탄력성과 총수입의 변화로 옳은 것은?',
  ['탄력성 0.25(비탄력적), 총수입 증가','탄력성 0.25(비탄력적), 총수입 감소','탄력성 4(탄력적), 총수입 증가','탄력성 4(탄력적), 총수입 감소','탄력성 1(단위탄력적), 총수입 변화 없음'], 0,
  ['탄력성은 맞아요! 하지만 비탄력적일 때 가격을 올리면 총수입은 “증가”해요. (100,000원 → 114,000원)','탄력성이 거꾸로예요. 수량 5% ÷ 가격 20% = 0.25예요.','탄력성이 거꾸로 계산됐고, 이 경우는 탄력적이 아니에요.','가격은 20%, 수량은 5%로 서로 달라요. 1이 아니에요.'],
  '가격 변화율 = 200 ÷ 1,000 = 20%, 수량 변화율 = 5 ÷ 100 = 5%라서 탄력성 = 5 ÷ 20 = 0.25(비탄력적)예요. 총수입은 100,000원에서 1,200×95 = 114,000원으로 늘어요.',
  '비탄력적일 땐 가격을 올리면 총수입↑, 내리면 ↓')},

{s:2, t:'탄력성과 총수입(상품 고르기)',
 A:Q('다음은 네 가지 상품의 수요의 가격탄력성이다. 각 상품의 가격을 10% 인하했을 때 총수입(판매 수입)이 증가하는 상품만을 있는 대로 고른 것은?',
  ['가, 나','나, 라','다, 라','가, 다','가, 나, 다, 라'], 1,
  ['소금(0.3)은 비탄력적이에요. 가격을 내려도 판매량이 별로 안 늘어 총수입이 줄어요.','수돗물(0.4)은 비탄력적이라 가격을 내리면 총수입이 줄어요.','소금(0.3), 수돗물(0.4)은 비탄력적이에요. 가격 인하는 총수입을 줄여요.','비탄력적인 소금과 수돗물은 가격을 내리면 총수입이 줄어요.'],
  '탄력성이 1보다 큰(탄력적인) 상품은 가격을 내리면 판매량이 크게 늘어 총수입이 늘어요. 놀이공원(2.0)과 운동화(1.5)가 해당돼요.',
  '가격을 내려서 이득을 보는 건 탄력성이 1보다 큰 상품!',
  {fix:true, table:{head:['구분','가. 소금','나. 놀이공원 자유이용권','다. 수돗물','라. 유명 브랜드 운동화'], rows:[['탄력성','0.3','2.0','0.4','1.5']]}}),
 B:Q('다음은 네 가지 상품의 수요의 가격탄력성이다. 각 상품의 가격을 10% 인상했을 때 총수입(판매 수입)이 증가하는 상품만을 있는 대로 고른 것은?',
  ['가, 다','나, 라','가, 나','다, 라','나, 다, 라'], 0,
  ['나(2.5), 라(1.8)는 탄력적이라 가격을 올리면 판매량이 크게 줄어 총수입이 줄어요.','나(2.5)는 탄력적이라 가격을 올리면 총수입이 줄어요.','라(1.8)는 탄력적이라 가격을 올리면 총수입이 줄어요.','나(2.5), 라(1.8)는 탄력적이라 빼야 해요.'],
  '탄력성이 1보다 작은(비탄력적인) 상품은 가격을 올려도 판매량이 조금만 줄어 총수입이 늘어요. 쌀(0.4)과 소금(0.2)이 해당돼요.',
  '가격을 올려서 이득을 보는 건 탄력성이 1보다 작은 상품!',
  {fix:true, table:{head:['구분','가. 쌀','나. 해외여행','다. 소금','라. 스마트폰 케이스'], rows:[['탄력성','0.4','2.5','0.2','1.8']]}})},

/* ───────── 4. 가격 규제·세금 ───────── */
{s:3, t:'최저가격제',
 A:Q('다음은 쌀 시장의 가격에 따른 수요량과 공급량이다. 정부가 쌀 농가를 보호하기 위해 쌀 가격을 kg당 4,000원 아래로 내려가지 못하도록 최저가격제를 실시하였다. 이때 시장에서 나타나는 현상으로 옳은 것은?',
  ['초과수요 40톤이 발생한다.','초과수요 20톤이 발생한다.','초과공급 40톤이 발생한다.','초과공급 20톤이 발생한다.','시장균형이 그대로 유지된다.'], 2,
  ['4,000원에서는 수요 30, 공급 70으로 공급이 더 많아요. 초과“공급”이에요.','공급이 더 많으니 초과공급이고, 차이도 40이에요.','초과공급은 맞지만 차이는 70 − 30 = 40이에요.','균형가격(3,000원)보다 높은 가격을 강제했으니 균형이 깨져요.'],
  '최저가격 4,000원에서 사려는 양은 30톤, 팔려는 양은 70톤이에요. 남는 40톤이 초과공급이에요.',
  '최저가격제(균형보다 높게) → 초과공급 / 최고가격제(균형보다 낮게) → 초과수요',
  {table:{head:['가격(원/kg)','1,000','2,000','3,000','4,000','5,000'], rows:[['수요량(톤)','90','70','50','30','10'],['공급량(톤)','10','30','50','70','90']]}}),
 B:Q('정부가 노동시장의 균형임금보다 높은 수준으로 최저임금을 정했다. 이때 나타날 수 있는 현상으로 가장 적절한 것은?',
  ['일하려는 사람보다 일자리가 더 많아진다.','일하려는 사람이 일자리보다 많아져 일자리를 구하지 못하는 사람이 생길 수 있다.','시장균형이 그대로 유지된다.','노동 수요가 저절로 증가한다.','임금이 균형임금보다 낮아진다.'], 1,
  ['임금이 높아지면 일하려는 사람은 늘고 기업의 일자리(수요)는 줄어요. 일자리가 남는 게 아니에요.','균형보다 높은 임금을 강제했으니 균형이 깨져요.','임금이 높아지면 기업은 오히려 노동 수요(고용)를 줄여요.','최저임금은 균형임금보다 “높게” 정한 거예요.'],
  '균형보다 높은 가격(임금)에서는 공급(일하려는 사람)이 수요(일자리)보다 많아요. 초과공급이 생겨 일자리를 못 구하는 사람이 생길 수 있어요.',
  '균형보다 “높게” 묶으면 → 초과공급(남음)')},

{s:3, t:'최고가격제',
 A:Q('정부가 어떤 상품의 균형가격보다 낮은 수준에서 최고가격제를 실시했다. 이때 초과수요가 발생하는 이유로 가장 적절한 것은?',
  ['가격이 낮아져 수요량은 늘고 공급량은 줄기 때문이다.','가격이 낮아져 수요량은 줄고 공급량은 늘기 때문이다.','수요곡선은 오른쪽으로, 공급곡선은 왼쪽으로 이동했기 때문이다.','수요량과 공급량이 모두 늘어났기 때문이다.','수요량과 공급량이 모두 줄어들었기 때문이다.'], 0,
  ['방향이 반대예요. 가격이 낮아지면 사려는 양(수요량)은 늘고 팔려는 양(공급량)은 줄어요.','곡선이 이동한 게 아니에요. 가격이 낮아져 곡선 “위에서” 수요량·공급량이 움직인 거예요.','수요량은 늘지만 공급량은 줄어요. 둘 다 느는 건 아니에요.','수요량은 오히려 늘어나요. 둘 다 줄지는 않아요.'],
  '가격이 균형보다 낮아지면 사려는 사람은 더 많아지고(수요량↑) 팔려는 사람은 줄어요(공급량↓). 그래서 사려는 양이 더 많은 초과수요가 생겨요.',
  '가격 때문에 변하면 “곡선 위”의 이동 (곡선 이동 아님!)'),
 B:Q('정부가 월세 부담을 줄이기 위해 월세의 상한을 시장 균형 월세보다 낮게 정했다. 이때 나타날 수 있는 현상으로 가장 적절한 것은?',
  ['임대하려는 집이 늘어 집을 구하기 쉬워진다.','집을 구하려는 사람이 임대 공급보다 많아져 집 구하기가 어려워진다.','월세가 균형 월세보다 높아진다.','임대하려는 집이 남아돌아 초과공급이 생긴다.','집을 구하려는 사람이 모두 사라진다.'], 1,
  ['월세가 낮아지면 집주인이 내놓는 집(공급량)은 오히려 줄어요.','상한이므로 월세는 균형보다 “낮게” 묶여요.','낮은 가격에서는 남는 게 아니라 부족한 초과수요가 생겨요.','월세가 싸졌으니 집을 구하려는 사람은 오히려 늘어요.'],
  '균형보다 낮은 최고가격(월세 상한)에서는 구하려는 사람은 늘고 내놓는 집은 줄어 초과수요가 생겨요.',
  '균형보다 “낮게” 묶으면 → 초과수요(부족)')},

{s:3, t:'조세 부담',
 A:Q('어떤 상품에 세금을 부과할 때 조세 부담에 대한 설명으로 가장 적절한 것은?',
  ['수요가 공급보다 비탄력적이면 소비자가 세금을 더 많이 부담한다.','세금은 법적으로 납부하는 쪽이 항상 전부 부담한다.','수요가 공급보다 비탄력적이면 생산자가 세금을 더 많이 부담한다.','공급이 수요보다 탄력적이면 생산자가 세금을 더 많이 부담한다.','탄력성과 관계없이 소비자와 생산자가 항상 절반씩 부담한다.'], 0,
  ['법적으로 세금을 내는 쪽과 실제로 부담하는 쪽은 다를 수 있어요. 가격이 오르면 소비자도 부담해요.','수요가 비탄력적이면 소비자가 피하기 어려워서 소비자가 더 부담해요. 생산자가 아니에요.','공급이 탄력적이면 생산자가 떠나기 쉬워서 오히려 소비자가 더 부담해요.','부담은 탄력성에 따라 달라져요. 항상 반반이 아니에요.'],
  '가격 변화에 덜 민감한(비탄력적인) 쪽이 세금을 더 많이 떠안아요. 수요가 비탄력적이면 소비자가 더 많이 부담해요.',
  '피하기 어려운(비탄력적) 쪽이 세금을 더 부담!'),
 B:Q('사치품처럼 가격이 오르면 소비자가 쉽게 구매를 포기하는(수요가 탄력적인) 상품에 세금이 부과되었다. 조세 부담에 대한 설명으로 가장 적절한 것은?\n(단, 공급은 수요보다 비탄력적이다.)',
  ['소비자가 세금을 더 많이 부담한다.','생산자가 세금을 더 많이 부담한다.','아무도 세금을 부담하지 않는다.','법적으로 세금을 내는 쪽이 항상 전부 부담한다.','탄력성과 관계없이 항상 절반씩 부담한다.'], 1,
  ['수요가 탄력적이면 소비자는 값이 오르면 쉽게 떠나요. 그래서 소비자 몫이 작아요.','세금은 누군가 반드시 부담해요. 소비자와 생산자가 나눠서 져요.','법적 납세자와 실제 부담자는 다를 수 있어요.','부담은 탄력성에 따라 달라져요. 항상 반반이 아니에요.'],
  '탄력적인 소비자는 가격이 오르면 구매를 포기하니, 생산자가 가격을 올리기 어려워 세금을 더 많이 부담해요.',
  '피하기 쉬운(탄력적) 쪽은 덜 부담, 피하기 어려운 쪽이 더 부담')},

/* ───────── 5. 외부효과·공공재 ───────── */
{s:4, t:'외부효과의 종류',
 A:Q('다음 (가), (나) 사례에 대한 설명으로 옳은 것은?',
  ['(가) 긍정적 외부효과 · 과다 생산\n(나) 부정적 외부효과 · 과소 생산','(가) 부정적 외부효과 · 과소 생산\n(나) 긍정적 외부효과 · 과다 생산','(가) 긍정적 외부효과 · 과소 생산\n(나) 부정적 외부효과 · 과소 생산','(가) 긍정적 외부효과 · 과소 생산\n(나) 부정적 외부효과 · 과다 생산','(가) 부정적 외부효과 · 과다 생산\n(나) 긍정적 외부효과 · 과소 생산'], 3,
  ['(가)는 남에게 이익을 주니 긍정적이지만, 시장에 맡기면 “적게” 이루어져요(과소). (나)도 과다예요. 둘 다 반대로 골랐어요.','(가)는 이익을 주니 긍정적, (나)는 피해를 주니 부정적이에요. 이름부터 반대로 골랐어요.','(가)는 맞아요! 그런데 (나)는 피해를 주고도 비용을 안 내니 “과다” 생산돼요.','(가)는 이익을 주니 긍정적(과소), (나)는 피해를 주니 부정적(과다)이에요. 둘 다 반대예요.'],
  '(가) 이익을 주는 긍정적 외부효과는 시장에 맡기면 부족해져요(과소). (나) 피해를 주는 부정적 외부효과는 시장에 맡기면 지나치게 많아져요(과다).',
  '이익을 주면 “모자라고”, 피해를 주면 “넘쳐요”',
  {fix:true, box:['(가) 독감 예방접종을 받으면 접종자 본인뿐 아니라 주변 사람들의 감염 위험도 낮아진다.','(나) 공장이 내뿜는 매연으로 주변 주민이 피해를 입고 있지만, 공장은 그 피해 비용을 부담하지 않는다.','※ ‘과다·과소 생산’은 시장에 맡길 경우 사회적으로 바람직한 수준과 비교한 결과이다.']}),
 B:Q('다음 (가), (나) 사례에 대한 설명으로 옳은 것은?',
  ['(가) 긍정적 외부효과 · 과소 생산\n(나) 부정적 외부효과 · 과다 생산','(가) 긍정적 외부효과 · 과다 생산\n(나) 부정적 외부효과 · 과소 생산','(가) 부정적 외부효과 · 과다 생산\n(나) 긍정적 외부효과 · 과소 생산','(가) 긍정적 외부효과 · 과소 생산\n(나) 부정적 외부효과 · 과소 생산','(가) 부정적 외부효과 · 과소 생산\n(나) 긍정적 외부효과 · 과다 생산'], 0,
  ['(가)는 과소, (나)는 과다예요. 둘 다 반대로 골랐어요.','(가)는 이익을 주니 긍정적, (나)는 피해를 주니 부정적이에요. 이름부터 반대예요.','(가)는 맞아요! 그런데 (나)는 피해를 주고도 비용을 안 내니 “과다” 생산돼요.','(가)는 이익을 주니 긍정적이고, (나)는 피해를 주니 부정적이에요. 둘 다 반대예요.'],
  '꽃길은 남에게 이익을 주는 긍정적 외부효과(시장에 맡기면 과소), 소음은 남에게 피해를 주는 부정적 외부효과(시장에 맡기면 과다)예요.',
  '이익을 주면 “모자라고”, 피해를 주면 “넘쳐요”',
  {fix:true, box:['(가) 이웃이 가꾼 아름다운 꽃길 덕분에 동네를 지나는 사람들의 기분이 좋아졌다.','(나) 심야에 틀어 놓은 큰 음악 소리 때문에 이웃이 잠을 이루지 못하지만, 음악을 튼 사람은 아무 비용도 내지 않는다.']})},

{s:4, t:'사적 편익·사회적 편익',
 A:Q('독감 예방접종은 접종을 받은 사람뿐 아니라 주변 사람들의 감염 위험도 낮춘다. 이 상품을 시장에 맡겼을 때의 설명으로 가장 적절한 것은?',
  ['사적 편익이 사회적 편익보다 커서 과다 소비된다.','사적 편익이 사회적 편익보다 작아서 과소 소비된다.','사적 비용이 사회적 비용보다 작아서 과소 소비된다.','사적 편익과 사회적 편익이 같아서 적절하게 소비된다.','사적 비용이 사회적 비용보다 커서 과다 소비된다.'], 1,
  ['남에게도 이익을 주니 사회적 편익이 더 커요. 사적 편익이 더 큰 게 아니에요.','이 사례는 비용이 아니라 “편익” 문제예요. 비용 차이로 설명하면 틀려요.','주변 사람의 이익까지 있어 사회적 편익이 더 커요. 같지 않아요.','이 사례는 비용이 아니라 편익 문제이고, 결과도 과소 소비예요.'],
  '내가 얻는 이익(사적 편익)만 따져 접종하면, 주변 사람이 얻는 이익까지 합친 사회적 편익보다 작아서 접종이 적게 이루어져요(과소).',
  '사적 편익 < 사회적 편익 → 과소'),
 B:Q('공장이 매연을 내뿜어 주변 주민이 피해를 입는다. 이 상품을 시장에 맡기면 사회적으로 바람직한 수준보다 많이 생산되는 이유로 가장 적절한 것은?',
  ['사적 비용이 사회적 비용보다 작기 때문이다.','사적 비용이 사회적 비용보다 크기 때문이다.','사적 편익이 사회적 편익보다 작기 때문이다.','공장이 손해를 감수하기 때문이다.','소비자가 가격을 무시하기 때문이다.'], 0,
  ['반대예요. 공장이 내는 비용(사적 비용)이 주민 피해까지 포함한 사회적 비용보다 “작아요”.','이 사례는 편익이 아니라 비용 문제예요.','공장은 피해 비용을 내지 않아서 오히려 이익을 보고 있어요.','소비자가 가격을 무시하는 것과는 관계가 없어요.'].slice(0,4).map((x,i)=>x),
  '공장은 자기 비용만 따지고 주민의 피해(외부 비용)는 계산하지 않아요. 사적 비용이 사회적 비용보다 작아서 지나치게 많이 생산돼요(과다).',
  '사적 비용 < 사회적 비용 → 과다')},

{s:4, t:'외부효과 해결 정책',
 A:Q('다음 (가), (나) 문제를 해결하기 위한 정부 정책으로 가장 적절한 것은?',
  ['(가) 보조금 지급\n(나) 세금 부과','(가) 세금(부담금) 부과\n(나) 보조금 지급','(가) 세금(부담금) 부과\n(나) 세금(부담금) 부과','(가) 보조금 지급\n(나) 보조금 지급','(가) 가격상한제 실시\n(나) 가격하한제 실시'], 1,
  ['반대로 골랐어요. 오염에는 세금, 예방접종에는 보조금이에요.','','(가)는 맞아요! 그런데 (나)에 세금을 매기면 접종이 더 줄어요.','(나)는 맞아요! 그런데 (가)에 보조금을 주면 오염을 오히려 늘려요.','가격상한·하한제는 외부효과를 직접 바로잡는 정책이 아니에요.'].filter(Boolean),
  '피해를 주는 쪽(부정적 외부효과)에는 세금·부담금으로 생산을 줄이고, 이익을 주는 쪽(긍정적 외부효과)에는 보조금으로 늘려요.',
  '피해 주면 세금, 이익 주면 보조금',
  {fix:true, box:['(가) 공장의 매연으로 인한 대기오염이 심각하다.','(나) 예방접종이 사회에 필요한 수준보다 적게 이루어지고 있다.']}),
 B:Q('다음 (가), (나) 문제를 해결하기 위한 정부 정책으로 가장 적절한 것은?',
  ['(가) 혼잡통행료(부담금) 부과\n(나) 이용 보조금 지급','(가) 보조금 지급\n(나) 이용료 인상','(가) 혼잡통행료 부과\n(나) 이용료 인상','(가) 보조금 지급\n(나) 보조금 지급','(가) 가격상한제 실시\n(나) 가격하한제 실시'], 0,
  ['(가)에 보조금을 주면 혼잡이 더 심해져요. 반대로 해야 해요.','(가)는 맞아요! 그런데 (나)의 이용료를 올리면 이용이 더 줄어요. 보조금이 필요해요.','(나)는 맞아요! 그런데 (가)에 보조금을 주면 혼잡을 키워요.','가격상한·하한제는 외부효과를 직접 바로잡는 정책이 아니에요.'].slice(0,4),
  '교통 혼잡(부정적 외부효과)은 통행료·부담금으로 줄이고, 도서관 이용(긍정적 외부효과)은 보조금으로 늘려요.',
  '피해 주면 세금, 이익 주면 보조금',
  {fix:true, box:['(가) 도심의 교통 혼잡과 매연이 심각하다.','(나) 학생들의 도서관 이용이 사회에 필요한 수준보다 적다.']})},

{s:4, t:'공공재',
 A:Q('다음 중 비배제성(대가를 내지 않은 사람도 막기 어려움)과 비경합성(한 사람이 소비해도 다른 사람의 소비량이 줄지 않음)을 모두 가진 재화로 가장 적절한 것은?',
  ['유료 고속도로','사설 학원 강의','영화관 좌석','편의점 도시락','국방 서비스'], 4,
  ['유료 고속도로는 요금을 안 내면 이용을 막을 수 있어요(배제성이 있어요).','학원 강의는 수강료를 낸 사람만 들을 수 있어요(배제성).','영화관 좌석은 한 사람이 앉으면 다른 사람이 못 앉아요(경합성).','도시락은 돈을 내야 하고(배제성), 한 사람이 먹으면 남이 못 먹어요(경합성).'],
  '국방은 돈을 안 낸 사람도 보호받고(비배제성), 한 사람이 보호받아도 다른 사람의 보호가 줄지 않아요(비경합성).',
  '비배제 + 비경합 = 공공재'),
 B:Q('다음 중 공공재만을 있는 대로 고른 것은?',
  ['ㄱ, ㄷ','ㄱ, ㄴ','ㄴ, ㄹ','ㄷ, ㄹ','ㄱ, ㄴ, ㄷ'], 0,
  ['ㄴ 피자는 돈을 내야 먹을 수 있고, 내가 먹으면 남이 못 먹어요. 공공재가 아니에요.','피자와 유료 놀이공원은 돈을 내야 이용하는 사적 재화예요.','ㄹ 유료 놀이공원은 입장료를 안 내면 막을 수 있어서 공공재가 아니에요.','ㄴ 피자는 사적 재화예요. 빼야 해요.'],
  '가로등과 등대는 돈을 안 낸 사람도 이용을 막기 어렵고(비배제성), 여럿이 같이 써도 줄지 않아요(비경합성).',
  '돈 안 내도 못 막고, 같이 써도 안 줄면 공공재',
  {fix:true, box:['ㄱ. 가로등','ㄴ. 피자','ㄷ. 등대','ㄹ. 유료 놀이공원']})},

{s:4, t:'무임승차',
 A:Q('골목길 가로등은 한 사람이 불빛을 이용한다고 해서 다른 사람이 이용할 수 있는 양이 줄지 않고, 설치 비용을 내지 않은 주민도 이용을 막기 어렵다. 그래서 일부 주민은 비용은 내지 않고 혜택만 누리려고 한다.\n이처럼 비용은 내지 않고 혜택만 누리려는 행위를 무엇이라 하는가?',
  ['무임승차','매몰비용','긍정적 외부효과','기회비용','세금 회피'], 0,
  ['매몰비용은 이미 써서 못 돌려받는 비용이에요.','외부효과는 거래와 상관없는 남에게 영향을 주는 거예요. “비용 안 내고 누리는 행동” 자체의 이름은 아니에요.','기회비용은 선택하며 포기한 것의 가치예요.','세금 회피는 세금을 안 내려는 행동이에요. 공공재 이용 문제의 용어는 무임승차예요.'],
  '버스에 요금을 안 내고 타듯, 비용은 안 내고 혜택만 누리는 행동을 무임승차라고 해요.',
  '공짜로 “탑승”하는 느낌 = 무임승차'),
 B:Q('공공재를 시장에 맡기면 사회에 필요한 만큼 충분히 공급되기 어렵다. 그 이유로 가장 적절한 것은?',
  ['무임승차 때문에 비용을 내려는 사람이 적어 기업이 생산해도 이익을 얻기 어렵기 때문이다.','공공재는 수요가 전혀 없기 때문이다.','공공재는 생산 비용이 항상 0원이기 때문이다.','기업들이 공공재를 너무 많이 생산하기 때문이다.','소비자들이 비싼 가격을 좋아하기 때문이다.'], 0,
  ['공공재도 사람들이 원해요. 문제는 값을 내려 하지 않는 거예요.','공공재도 만들 때는 비용이 들어요.','오히려 시장에 맡기면 너무 적게 생산돼요.','소비자가 비싼 가격을 좋아한다는 근거는 없어요. 문제는 무임승차예요.'],
  '비용을 안 내도 이용할 수 있으니 값을 내려는 사람이 적어요. 기업이 이익을 못 얻어 공급하기 어려우니 정부가 세금으로 공급해요.',
  '무임승차 → 시장에 맡기면 공공재가 모자라요')},

/* ───────── 6. GDP·물가·실업 ───────── */
{s:5, t:'GDP의 개념',
 A:Q('국내총생산(GDP)에 대한 설명으로 옳은 것은?',
  ['한 나라 국민이 가진 재산의 총합이다.','일정 기간 한 나라 안에서 새로 생산된 최종 재화와 서비스의 시장 가치를 합한 것이다.','그 나라 기업이 세계 어디서든 생산한 것의 합이다.','정부가 쓴 지출만 모두 합한 것이다.','중간재를 포함해 모든 거래 금액을 합한 것이다.'], 1,
  ['재산의 총합이 아니라 “일정 기간 새로 생산한 것”을 계산해요.','GDP는 “국내(영토)” 기준이라 우리나라 기업의 해외 생산은 포함되지 않아요.','정부 지출은 GDP의 일부일 뿐이에요.','중간재까지 더하면 이중으로 계산돼요. 최종 생산물만 계산해요.'],
  'GDP의 핵심 단어는 “일정 기간(올해)”, “국내”, “새롭게 생산”, “최종 생산물”, “시장 가치”예요.',
  '올해 · 국내 · 새로 · 최종 · 시장'),
 B:Q('밀농가가 밀을 500원에 팔고, 제분소가 이 밀로 밀가루를 만들어 1,000원에 팔고, 빵집이 이 밀가루로 빵을 만들어 3,000원에 소비자에게 팔았다. 이 빵과 관련해 GDP에 반영되는 금액은?',
  ['500원','1,000원','3,000원','4,000원','4,500원'], 2,
  ['밀은 중간 단계(중간재)예요. 최종 생산물만 계산해요.','밀가루도 빵의 재료라서 중간재예요.','밀가루와 빵을 더하면 중복 계산이에요.','500 + 1,000 + 3,000처럼 단계별로 다 더하면 중복(이중 계산)돼요.'],
  '중간재는 빼고, 소비자에게 팔린 최종 생산물(빵 3,000원)만 GDP에 반영해요.',
  '재료는 빼고 완제품만!')},

{s:5, t:'GDP에 포함되는 것',
 A:Q('다음 중 올해 우리나라의 GDP에 포함되는 것만을 있는 대로 고른 것은?\n(단, 모든 거래와 생산은 올해 이루어진 것이다.)',
  ['ㄱ, ㄴ, ㅁ','ㄱ, ㄷ, ㅂ','ㄱ, ㄷ, ㅁ','ㄴ, ㄹ, ㅂ','ㄱ, ㄷ, ㄹ, ㅁ'], 2,
  ['ㄴ(중고차 판매 대금)은 새로 생산된 게 아니라 제외돼요. 그리고 ㄷ(중개수수료)이 빠졌어요.','ㅂ(우리 기업의 해외 공장 생산)은 “국내” 생산이 아니라 제외예요. 대신 ㅁ이 포함돼요.','ㄴ(중고차 대금), ㄹ(무급 가사노동), ㅂ(해외 생산)은 모두 제외돼요.','ㄹ(가정 내 무급 가사노동)은 시장에서 거래되지 않아 제외돼요.'],
  '국내에서 올해 새로 생산되어 시장에서 거래되면 포함이에요. ㄱ 신형 자동차, ㄷ 중개수수료(서비스), ㅁ 외국 기업이어도 국내 생산은 포함이에요. ㄴ(이미 만들어진 중고차), ㄹ(시장 거래 없음), ㅂ(해외 생산)은 제외예요.',
  'GDP는 국적이 아니라 “국내 영토” 기준!',
  {fix:true, box:['ㄱ. 국내 공장에서 새로 생산된 신형 자동차','ㄴ. 개인 간에 거래된 중고 자동차의 판매 대금','ㄷ. 중고차 중개업체가 올해 받은 중개수수료','ㄹ. 가정 내에서 가족이 하는 무급 가사노동','ㅁ. 외국 기업이 우리나라 국내 공장에서 생산한 제품','ㅂ. 우리나라 기업이 해외 공장에서 생산한 제품']}),
 B:Q('다음 중 올해 우리나라의 GDP에 포함되는 것만을 있는 대로 고른 것은?\n(단, 모든 거래와 생산은 올해 이루어진 것이다.)',
  ['ㄱ, ㄷ, ㅁ','ㄱ, ㄴ, ㅁ','ㄱ, ㄷ, ㅂ','ㄴ, ㄹ, ㅂ','ㄱ, ㄷ, ㄹ, ㅁ'], 0,
  ['','ㄴ(10년 전에 지은 아파트의 매매 대금)은 올해 새로 생산된 게 아니라 제외돼요.','ㅂ(해외 공장 생산)은 국내 생산이 아니라 제외돼요.','ㄴ, ㄹ, ㅂ은 모두 제외 대상이에요.','ㄹ(집에서 가족을 위해 만든 요리)은 시장 거래가 없어 제외돼요.'].filter(Boolean),
  '올해, 국내에서, 새로 생산되고 시장에서 거래된 ㄱ·ㄷ·ㅁ만 포함돼요.',
  'GDP는 국적이 아니라 “국내 영토” 기준!',
  {fix:true, box:['ㄱ. 올해 새로 지은 아파트의 건설','ㄴ. 10년 전에 지은 아파트의 올해 매매 대금','ㄷ. 음식점에서 올해 만들어 판매한 요리','ㄹ. 주부가 집에서 가족을 위해 만든 요리','ㅁ. 우리나라에 사는 외국인 가수의 국내 공연 수입','ㅂ. 우리나라 기업이 베트남 공장에서 만든 제품']})},

{s:5, t:'중고품 거래와 GDP',
 A:Q('다음 주장에 대한 설명으로 가장 적절한 것은?\n“중고 자동차가 올해 2,000만 원에 판매되었으므로, 올해 우리나라 GDP가 2,000만 원 증가한다.”',
  ['중고차는 올해 새로 생산된 것이 아니므로 판매 대금은 GDP에 포함되지 않지만, 거래를 중개한 서비스의 수수료는 포함될 수 있다.','개인 간 거래이므로 중고차 판매 대금도 중개수수료도 GDP에 포함되지 않는다.','중고차는 가격이 낮아서 GDP에서 제외된다.','중고차 판매 대금 2,000만 원과 중개수수료가 모두 GDP에 포함된다.','국내에서 거래된 것이 아니므로 GDP에서 제외된다.'], 0,
  ['중개업체가 올해 제공한 서비스는 새로 생산된 거라 수수료는 포함돼요.','가격이 낮아서가 아니라 “올해 새로 생산된 것이 아니어서” 제외돼요.','중고차 판매 대금은 이미 과거에 생산된 것이라 포함되지 않아요.','국내에서 거래됐어요. 제외되는 이유는 “새로 생산”이 아니기 때문이에요.'],
  'GDP는 올해 새로 생산된 것만 계산해요. 중고차는 이미 생산된 해에 GDP에 들어갔어요. 하지만 거래를 중개한 서비스(수수료)는 올해 새로 생산된 서비스라 포함돼요.',
  '“주인만 바뀐 것”은 GDP가 아니에요. 새로 만든 서비스는 GDP!'),
 B:Q('지은 지 10년 된 집이 올해 5억 원에 매매되었다. 이 거래와 관련해 올해 우리나라 GDP에 반영되는 것으로 가장 적절한 것은?',
  ['5억 원 전체','집값의 절반인 2억 5천만 원','부동산 중개수수료','아무것도 반영되지 않는다','집을 산 사람이 낸 세금 전체'], 2,
  ['10년 전에 이미 생산된 집이라 올해 새로 생산된 게 아니에요.','절반이든 전체든 이미 만들어진 집의 값은 포함되지 않아요.','집값은 빠지지만, 거래를 중개한 서비스(수수료)는 올해 새로 생산돼 포함돼요.','GDP는 낸 세금이 아니라 새로 생산된 가치를 계산해요.'],
  '집값은 이미 생산된 것이라 제외지만, 올해 제공된 중개 서비스의 수수료는 새로 생산된 가치라 GDP에 반영돼요.',
  '“주인만 바뀐 것”은 GDP가 아니에요. 새로 만든 서비스는 GDP!')},

{s:5, t:'명목 GDP와 실질 GDP',
 A:Q('어느 나라는 빵과 우유만 생산한다. 2024년을 기준연도로 할 때, 다음 자료를 보고 2025년의 명목 GDP와 실질 GDP를 바르게 짝지은 것은?',
  ['명목 220,000원 / 실질 270,000원','명목 270,000원 / 실질 220,000원','명목 270,000원 / 실질 270,000원','명목 220,000원 / 실질 220,000원','명목 320,000원 / 실질 270,000원'], 1,
  ['명목과 실질을 서로 바꿨어요. 명목 GDP는 “그해 가격”, 실질 GDP는 “기준연도 가격”으로 계산해요.','물가가 올랐으니 명목과 실질이 같을 수 없어요. 실질은 기준연도(2024) 가격으로 계산해야 해요.','명목은 2025년 가격으로 계산해야 해서 220,000원이 아니에요.','계산 값이 달라요. 명목은 1,200×100 + 2,500×60 = 270,000원이에요.'],
  '명목 GDP = 2025 가격 × 2025 생산량 = 1,200×100 + 2,500×60 = 270,000원이에요. 실질 GDP = 2024(기준연도) 가격 × 2025 생산량 = 1,000×100 + 2,000×60 = 220,000원이에요.',
  '명목 = 그해 가격, 실질 = 기준연도 가격 (생산량은 둘 다 그해)',
  {table:{head:['구분','2024 가격','2024 생산량','2025 가격','2025 생산량'], rows:[['빵','1,000원','100개','1,200원','100개'],['우유','2,000원','50개','2,500원','60개']]}}),
 B:Q('어느 나라는 과자와 주스만 생산한다. 2024년을 기준연도로 할 때, 다음 자료를 보고 2025년의 명목 GDP와 실질 GDP를 바르게 짝지은 것은?',
  ['명목 250,000원 / 실질 285,000원','명목 285,000원 / 실질 250,000원','명목 285,000원 / 실질 285,000원','명목 220,000원 / 실질 250,000원','명목 285,000원 / 실질 200,000원'], 1,
  ['명목과 실질을 서로 바꿨어요. 명목 GDP는 “그해 가격”, 실질 GDP는 “기준연도 가격”이에요.','실질 GDP는 기준연도(2024) 가격으로 계산해야 해서 285,000원이 아니에요.','명목은 2025년 가격으로 600×200 + 1,100×150 = 285,000원이에요.','실질 GDP를 2024년 생산량으로 계산한 값이에요. 2025년 생산량(200개, 150개)에 2024년 가격을 곱해야 해요.'],
  '명목 GDP = 600×200 + 1,100×150 = 285,000원이에요. 실질 GDP = 2024 가격 × 2025 생산량 = 500×200 + 1,000×150 = 250,000원이에요.',
  '명목 = 그해 가격, 실질 = 기준연도 가격 (생산량은 둘 다 그해)',
  {table:{head:['구분','2024 가격','2024 생산량','2025 가격','2025 생산량'], rows:[['과자','500원','200개','600원','200개'],['주스','1,000원','100개','1,100원','150개']]}})},

{s:5, t:'물가상승률',
 A:Q('어느 나라의 물가지수가 2024년에 125, 2025년에 130이었다. 2025년의 물가상승률은?',
  ['1%','2%','3%','4%','5%'], 3,
  ['차이 5를 작년 지수 125로 나누면 0.04, 즉 4%예요. 1%가 아니에요.','2%가 아니에요. 5 ÷ 125 = 0.04 = 4%예요.','3%가 아니에요. 5 ÷ 125 = 0.04 = 4%예요.','5는 지수의 “차이”예요. 비율로 바꾸려면 작년 지수(125)로 나눠야 해요.'],
  '물가상승률 = (올해 지수 − 작년 지수) ÷ 작년 지수 × 100 = (130 − 125) ÷ 125 × 100 = 4%예요.',
  '(올해 − 작년) ÷ 작년 × 100'),
 B:Q('어느 나라의 물가지수가 2024년에 200, 2025년에 210이었다. 2025년의 물가상승률은?',
  ['2%','3%','4%','5%','10%'], 3,
  ['차이 10을 작년 지수 200으로 나누면 0.05예요. 2%가 아니에요.','10 ÷ 200 = 0.05 = 5%예요. 3%가 아니에요.','10 ÷ 200 = 0.05 = 5%예요. 4%가 아니에요.','10은 지수의 “차이”예요. 작년 지수(200)로 나눠야 해서 5%예요.'],
  '물가상승률 = (210 − 200) ÷ 200 × 100 = 5%예요.',
  '(올해 − 작년) ÷ 작년 × 100')},

{s:5, t:'실업률 계산',
 A:Q('어느 지역의 15세 이상 인구는 500명이다. 이 중 취업자는 360명, 비경제활동인구는 100명이고 나머지는 실업자이다.\n실업자 수와 실업률로 옳은 것은?',
  ['실업자 40명, 실업률 8%','실업자 40명, 실업률 10%','실업자 140명, 실업률 28%','실업자 40명, 실업률 11.1%','실업자 100명, 실업률 20%'], 1,
  ['실업률은 15세 이상 인구(500)가 아니라 “경제활동인구(400)”로 나눠요. 40 ÷ 500은 틀려요.','','비경제활동인구(100)까지 실업자로 셌어요. 비경제활동인구는 실업자가 아니에요.','취업자(360)로 나눴어요. 경제활동인구(400)로 나눠야 해요.','비경제활동인구 100명을 실업자로 착각했어요.'].filter(Boolean),
  '경제활동인구 = 500 − 100 = 400명, 실업자 = 400 − 360 = 40명, 실업률 = 40 ÷ 400 × 100 = 10%예요.',
  '실업률 = 실업자 ÷ 경제활동인구 (전체 인구 아님!)'),
 B:Q('어느 지역의 15세 이상 인구는 800명이다. 이 중 취업자는 570명, 비경제활동인구는 200명이고 나머지는 실업자이다.\n실업자 수와 실업률로 옳은 것은?',
  ['실업자 30명, 실업률 5%','실업자 30명, 실업률 3.75%','실업자 230명, 실업률 28.75%','실업자 30명, 실업률 5.26%','실업자 60명, 실업률 10%'], 0,
  ['실업률은 15세 이상 인구(800)가 아니라 경제활동인구(600)로 나눠요.','비경제활동인구 200명을 실업자에 넣었어요. 실업자는 30명이에요.','취업자(570)로 나눴어요. 경제활동인구(600)로 나눠야 해요.','실업자 수 계산이 달라요. 경제활동인구 600 − 취업자 570 = 30명이에요.'],
  '경제활동인구 = 800 − 200 = 600명, 실업자 = 600 − 570 = 30명, 실업률 = 30 ÷ 600 × 100 = 5%예요.',
  '실업률 = 실업자 ÷ 경제활동인구 (전체 인구 아님!)')}
];

/* ───────── 추가 문제은행: 개념마다 C, D 버전 (총 120문제) ───────── */
const EXTRA = [
/* 1 희소성 */
{C:Q('다음 중 희소성 때문에 “선택”이 필요해지는 이유를 가장 잘 설명한 것은?',
  ['사람들의 욕구는 끝이 없지만 이를 채워 줄 자원은 한정되어 있기 때문이다.','정부가 물건 값을 정해 놓았기 때문이다.','모든 자원이 완전히 고갈되었기 때문이다.','기업들이 물건을 일부러 적게 만들기 때문이다.','돈이 많은 사람은 선택할 필요가 없기 때문이다.'], 0,
  ['가격 규제와 상관없이, 자원이 한정된 한 선택은 필요해요.','자원이 모두 없어진 게 아니라 “욕구보다 부족”한 거예요.','기업의 의도와 상관없이 자원이 한정된 것이 근본 이유예요.','돈이 많아도 시간과 자원은 한정되어 있어 누구나 선택해야 해요.'],
  '욕구는 끝이 없는데 자원은 한정되어 있어서, 무엇을 먼저 채울지 선택해야 해요.','욕구는 무한, 자원은 유한 → 선택!'),
 D:Q('다음 중 희소성에 대한 설명으로 옳지 않은 것은?',
  ['부자 나라에도 존재한다.','자원이 욕구보다 상대적으로 부족한 상태이다.','물건 값이 싸지면 희소성이 완전히 사라진다.','선택의 문제가 생기는 근본 원인이다.','시간과 돈도 희소한 자원이다.'], 2,
  ['옳은 설명이에요. 부자 나라도 욕구가 더 크면 희소해요. “옳지 않은 것”을 골라야 해요.','옳은 설명이에요. 희소성의 정의 그대로예요.','옳은 설명이에요. 희소성 때문에 선택이 필요해요.','옳은 설명이에요. 시간과 돈도 한정되어 있어요.'],
  '값이 싸져도 욕구에 비해 자원이 부족하면 희소성은 그대로예요. 가격과 희소성은 별개예요.','희소성은 가격이 아니라 “욕구 vs 자원”')},
/* 2 기회비용 */
{C:Q('다음 중 ‘기회비용’을 가장 바르게 이해한 학생의 말은?',
  ['“어떤 걸 고르면, 포기한 것 중 가장 가치가 큰 것이 기회비용이야.”','“이미 낸 돈이 기회비용이야.”','“고른 것의 가격이 기회비용이야.”','“포기한 것들을 전부 더한 게 기회비용이야.”','“공짜로 얻은 건 기회비용이 항상 0이야.”'], 0,
  ['이미 낸 돈은 매몰비용이에요. 기회비용은 포기한 것의 가치예요.','고른 것의 가격이 아니라, 포기한 것의 가치예요.','포기한 걸 다 더하는 게 아니라 가장 큰 것 하나예요.','공짜로 얻어도 그 시간에 다른 걸 할 수 있었다면 기회비용이 있어요.'],
  '기회비용은 “포기한 것 중 가장 가치가 큰 것”이에요.','선택한 것 말고, 포기한 것 중 1등!'),
 D:Q('지수는 (가) 도서관에서 공부(4만 원 상당의 만족), (나) 아르바이트(6만 원 수입), (다) 친구와 놀기(5만 원 상당의 만족) 중 하나만 할 수 있어서 (가)를 선택했다.\n지수의 기회비용은?',
  ['4만 원','5만 원','6만 원','11만 원','15만 원'], 2,
  ['4만 원은 선택한 (가)의 가치예요. 기회비용은 포기한 것의 가치예요.','5만 원은 포기한 것 중 두 번째로 큰 가치예요. 가장 큰 건 아르바이트 6만 원이에요.','포기한 두 개(6만+5만)를 더했어요. 가장 큰 것 하나만이에요.','선택한 것까지 모두 더했어요. 선택한 것은 빼고 가장 큰 포기 하나만!'],
  '(가)를 고르며 포기한 건 아르바이트 6만 원과 놀기 5만 원이에요. 이 중 가장 큰 6만 원이 기회비용이에요.','선택한 것은 빼고, 포기한 것 중 “최고” 하나!')},
/* 3 명시적·암묵적 비용 */
{C:Q('다음 중 ‘명시적 비용’만을 있는 대로 고른 것은?',
  ['ㄱ, ㄷ','ㄴ, ㄷ','ㄱ, ㄴ, ㄹ','ㄱ, ㄷ, ㄹ','ㄴ'], 3,
  ['ㄱ, ㄷ은 맞아요! 그런데 ㄹ(직원 급여)도 실제로 낸 돈이라 포함돼요.','ㄴ은 포기한 수입이라 암묵적 비용이에요.','ㄴ(포기한 월급)은 암묵적 비용이라 빼야 해요.','ㄴ은 암묵적 비용이에요. 명시적 비용이 아니에요.'],
  '실제로 돈을 낸 임차료·재료비·급여는 명시적 비용이고, 포기한 월급은 암묵적 비용이에요.','돈이 실제로 나가면 명시적, 포기한 수입이면 암묵적',
  {box:['ㄱ. 가게 임차료로 낸 돈','ㄴ. 사장님이 장사하느라 포기한 월급','ㄷ. 재료 구입비','ㄹ. 직원에게 준 급여']}),
 D:Q('민지는 학원 강사 일(월 300만 원)을 그만두고 자기 학원을 차렸다. 첫 달에 임차료 150만 원, 교재비 50만 원을 썼다.\n(기회비용 = 명시적 비용 + 암묵적 비용)\n첫 달 민지의 기회비용은?',
  ['200만 원','300만 원','350만 원','500만 원','650만 원'], 3,
  ['200만 원은 실제 낸 돈(명시적 비용)뿐이에요. 포기한 월급 300만 원도 더해요.','300만 원은 포기한 월급(암묵적 비용)뿐이에요. 임차료·교재비 200만 원도 더해요.','임차료를 빠뜨렸어요. 명시적 비용은 150 + 50 = 200만 원이에요.','650만 원은 임차료 150만 원을 한 번 더 더한 값이에요. 중복 없이 200 + 300!'],
  '명시적 비용 200만 원(임차료 150 + 교재비 50) + 암묵적 비용 300만 원(포기한 월급) = 500만 원이에요.','기회비용 = 낸 돈 + 포기한 수입')},
/* 4 기회비용 계산 */
{C:Q('하윤이는 일요일 5시간 동안 시급 9,000원 아르바이트를 하는 대신 무료 봉사활동을 하기로 했다. 봉사활동에 드는 교통비는 4,000원이다.\n(기회비용 = 명시적 비용 + 암묵적 비용)\n봉사활동을 선택한 하윤이의 기회비용은?',
  ['4,000원','45,000원','49,000원','54,000원','94,000원'], 2,
  ['4,000원은 교통비(명시적 비용)뿐이에요. 포기한 알바 수입도 더해요.','45,000원은 포기한 알바 수입(암묵적 비용)뿐이에요. 교통비도 더해요.','알바 수입 45,000원에 시급 9,000원을 또 더했어요. 5시간치(45,000원)만 계산해요.','45,000원을 두 번 더한 값이에요. 한 번씩만 더해요.'],
  '명시적 비용 4,000원(교통비) + 암묵적 비용 45,000원(포기한 알바 수입 9,000원×5시간) = 49,000원이에요.','기회비용 = 낸 돈 + 포기한 수입'),
 D:Q('도윤이는 4시간 동안 시급 11,000원 아르바이트를 하는 대신 25,000원짜리 요리 클래스에 가기로 했다. 클래스 재료비는 따로 5,000원이 든다.\n(기회비용 = 명시적 비용 + 암묵적 비용)\n요리 클래스를 선택한 도윤이의 기회비용은?',
  ['30,000원','44,000원','49,000원','74,000원','99,000원'], 3,
  ['30,000원은 수강료와 재료비(명시적 비용)뿐이에요. 포기한 알바 수입도 더해요.','44,000원은 포기한 알바 수입(암묵적 비용)뿐이에요. 30,000원도 더해요.','수강료를 빠뜨렸어요(5,000 + 44,000). 수강료 25,000원도 명시적 비용이에요.','99,000원은 수강료 25,000원을 한 번 더 더한 값이에요.'],
  '명시적 비용 30,000원(수강료 25,000 + 재료비 5,000) + 암묵적 비용 44,000원(11,000원×4시간) = 74,000원이에요.','기회비용 = 낸 돈 + 포기한 수입')},
/* 5 매몰비용 */
{C:Q('다음 중 ‘매몰비용’에 해당하는 것은?',
  ['환불이 불가능한 조건으로 이미 결제한 콘서트 티켓 값','콘서트에 가기로 하면서 포기한 아르바이트 수입','콘서트장까지 갈 때 앞으로 낼 택시비','콘서트에 가기 위해 앞으로 쓸 시간','콘서트에서 얻게 될 즐거움'], 0,
  ['포기한 알바 수입은 선택에 따라 달라지는 기회비용이에요.','앞으로 낼 택시비는 선택에 따라 달라지는 비용이라 매몰비용이 아니에요.','앞으로 쓸 시간은 선택에 따라 달라지는 비용이에요.','즐거움은 비용이 아니라 편익이에요.'],
  '이미 결제했고 돌려받을 수 없는 티켓 값이 매몰비용이에요.','못 돌려받는 이미 쓴 돈 = 매몰비용'),
 D:Q('준호는 뷔페에서 이미 20,000원을 내고 입장했는데, 배가 불러서 더 먹으면 속이 불편할 것 같다. 합리적인 판단으로 가장 적절한 것은?',
  ['낸 돈이 아까우니 배가 불러도 계속 먹는다.','낸 20,000원은 고려하지 않고, 더 먹었을 때의 만족과 불편함만 비교한다.','20,000원어치를 먹어서 본전을 뽑을 때까지 먹는다.','내일 점심을 굶더라도 많이 먹는다.','돈을 돌려받지 못하니 아무것도 먹지 않는다.'], 1,
  ['낸 돈은 어차피 돌아오지 않아요. 아까워서 먹는 건 합리적이지 않아요.','본전 뽑기는 매몰비용에 얽매이는 거예요.','앞으로의 불편이 더 커질 수 있어요. 합리적이지 않아요.','이미 낸 돈과 상관없이, 먹을 때의 만족이 더 크다면 먹는 게 맞아요. 앞으로의 득실로 판단해요.'],
  '입장료는 이미 낸 매몰비용이라 판단에서 빼고, 앞으로 먹을 때의 만족과 불편함만 비교해요.','이미 쓴 돈(매몰비용)은 잊고, 앞으로만 계산!')},
/* 6 수요량 vs 수요의 변화 */
{C:Q('스마트폰 케이스 시장에서 수요곡선 위에서의 이동(수요량의 변화)에 해당하는 것만을 있는 대로 고른 것은?\n(단, 다른 조건은 일정하다.)',
  ['ㄱ, ㄷ','ㄴ, ㄹ','ㄱ, ㄴ','ㄷ, ㄹ','ㄱ, ㄴ, ㄹ'], 0,
  ['ㄴ, ㄹ은 가격이 아닌 이유라 수요곡선이 이동하는 “수요의 변화”예요.','ㄴ은 유행 때문이라 수요의 변화예요. 가격 때문인 건 ㄱ과 ㄷ이에요.','ㄹ은 새 스마트폰 출시 때문이라 수요의 변화예요. ㄱ, ㄷ을 골라야 해요.','ㄴ, ㄹ은 수요의 변화라서 빼야 해요.'],
  '케이스 “가격”이 바뀌어 판매량이 달라진 ㄱ, ㄷ만 수요량의 변화예요.','가격 때문이면 “수요량”, 다른 이유면 “수요”',
  {box:['ㄱ. 케이스 가격이 올라 판매량이 줄었다.','ㄴ. 인기 연예인이 쓰는 케이스로 알려져 같은 가격에도 더 팔린다.','ㄷ. 케이스 가격이 내려 판매량이 늘었다.','ㄹ. 새 스마트폰이 출시되어 케이스를 찾는 사람이 늘었다.']}),
 D:Q('다음 중 ‘수요의 증가’(수요곡선의 오른쪽 이동)에 해당하는 것만을 있는 대로 고른 것은?\n(단, 다른 조건은 일정하다.)',
  ['ㄱ','ㄴ, ㄹ','ㄱ, ㄷ','ㄷ, ㄹ','ㄱ, ㄴ, ㄹ'], 1,
  ['ㄱ은 귤 가격 때문이라 수요량의 변화예요. 수요곡선은 그대로예요.','ㄱ, ㄷ은 모두 가격 때문이라 수요량의 변화예요.','ㄷ은 가격 때문에 구매량이 준 수요량의 변화예요. 수요 증가도 아니에요.','ㄱ은 가격 때문이라 빼야 해요.'],
  '가격은 그대로인데 보도(ㄴ), 소득(ㄹ) 때문에 사려는 양이 늘면 수요 증가예요.','가격 때문이면 “수요량”, 다른 이유면 “수요”',
  {box:['ㄱ. 귤 가격이 내려 구매량이 늘었다.','ㄴ. 귤이 건강에 좋다는 보도로 같은 가격에서도 귤을 더 사려 한다.','ㄷ. 귤 가격이 올라 구매량이 줄었다.','ㄹ. 소득이 늘어 같은 가격에서도 귤을 더 산다.']})},
/* 7 수요 변화 요인 */
{C:Q('다음 중 삼겹살 수요곡선을 오른쪽으로 이동시키는 요인만을 있는 대로 고른 것은?\n(단, 삼겹살은 정상재이며, 다른 조건은 일정하다.)',
  ['ㄱ, ㄴ','ㄱ, ㄷ','ㄴ, ㄹ','ㄱ, ㄴ, ㄷ','ㄱ, ㄴ, ㄷ, ㄹ'], 0,
  ['ㄷ(보완재 가격 상승)은 오히려 삼겹살 수요를 줄여요. 그리고 ㄴ이 빠졌어요.','ㄹ은 자기 가격 변화라 곡선 이동이 아니에요. 그리고 ㄱ이 빠졌어요.','ㄷ(보완재 가격 상승)은 수요를 줄여서 빼야 해요.','ㄷ과 ㄹ은 수요를 오른쪽으로 이동시키지 못해요.'],
  '소득 증가와 대체재 가격 상승은 수요 증가 요인이에요. 보완재 가격 상승은 수요 감소 요인이고, 자기 가격 변화는 곡선 위 이동이에요.','대체재 가격↑ → 내 수요↑ / 보완재 가격↑ → 내 수요↓',
  {box:['ㄱ. 소비자의 소득 증가','ㄴ. 대체재인 소고기 가격의 상승','ㄷ. 보완재인 상추 가격의 상승','ㄹ. 삼겹살 가격의 상승']}),
 D:Q('다음 중 영화관 관람 수요곡선을 왼쪽으로 이동시키는 요인만을 있는 대로 고른 것은?\n(단, 영화 관람은 정상재이며, 다른 조건은 일정하다.)',

  ['가격이 10% 올랐더니 수요량이 5% 줄었다.','가격이 10% 올랐더니 수요량이 10% 줄었다.','가격이 10% 올랐더니 수요량이 25% 줄었다.','가격이 10% 올랐더니 수요량이 1% 줄었다.','가격이 10% 올랐는데 수요량이 변하지 않았다.'], 2,
  ['5 ÷ 10 = 0.5로 비탄력적이에요.','10 ÷ 10 = 1이에요. 25 ÷ 10 = 2.5가 더 커요.','1 ÷ 10 = 0.1로 매우 비탄력적이에요.','수요량이 안 변하면 탄력성은 0이에요. 가장 작아요.'],

  ['대체재가 많은 상품일수록 수요가 비탄력적이다.','생활필수품일수록 수요가 비탄력적인 경향이 있다.','사치품일수록 수요가 비탄력적이다.','소득에서 차지하는 가격 비중이 클수록 수요가 비탄력적이다.','대체재가 없을수록 수요가 탄력적이다.'], 1,
  ['대체재가 많으면 다른 걸로 쉽게 옮겨 가서 오히려 탄력적이에요.','사치품은 안 사도 되니까 탄력적이에요.','가격 비중이 클수록 가격에 민감해져서 탄력적이에요.','대체재가 없으면 옮겨 갈 곳이 없어서 비탄력적이에요.'].reduce((a,x)=>{a.push(x);return a;},[]),
  '필수품은 값이 올라도 꼭 사야 하니 수요량이 별로 안 줄어요. 그래서 비탄력적이에요.','꼭 필요 → 비탄력적 / 안 사도 됨·대체재 많음 → 탄력적')},
/* 15 탄력성 계산과 총수입 */
{C:Q('아이스크림 가게에서 가격을 1,000원에서 900원으로 내렸더니 하루 판매량이 100개에서 130개로 늘었다.\n수요의 가격탄력성과 총수입의 변화로 옳은 것은?',
  ['탄력성 3(탄력적), 총수입 증가','탄력성 3(탄력적), 총수입 감소','탄력성 약 0.33(비탄력적), 총수입 증가','탄력성 약 0.33(비탄력적), 총수입 감소','탄력성 1, 총수입 변화 없음'], 0,
  ['탄력성은 맞아요! 그런데 탄력적일 때 가격을 내리면 총수입은 늘어요. (100,000원 → 117,000원)','탄력성이 거꾸로예요. 수량 30% ÷ 가격 10% = 3이에요.','탄력성이 거꾸로 계산됐고 총수입도 틀려요.','가격은 10%, 수량은 30%로 서로 달라요. 1이 아니에요.'].slice(0,4),
  '가격 변화율 10%, 수량 변화율 30%라서 탄력성 = 30 ÷ 10 = 3(탄력적)이에요. 총수입은 1,000×100 = 100,000원에서 900×130 = 117,000원으로 늘어요.','탄력적일 땐 가격을 내리면 총수입↑, 올리면 ↓'),
 D:Q('편의점에서 생수 가격을 500원에서 550원으로 올렸더니 하루 판매량이 200개에서 190개로 줄었다.\n수요의 가격탄력성과 총수입의 변화로 옳은 것은?',
  ['탄력성 0.5(비탄력적), 총수입 증가','탄력성 0.5(비탄력적), 총수입 감소','탄력성 2(탄력적), 총수입 증가','탄력성 2(탄력적), 총수입 감소','탄력성 1, 총수입 변화 없음'], 0,
  ['탄력성은 맞아요! 비탄력적일 때 가격을 올리면 총수입은 늘어요. (100,000원 → 104,500원)','탄력성이 거꾸로예요. 수량 5% ÷ 가격 10% = 0.5예요.','탄력성이 거꾸로 계산됐고 총수입도 틀려요.','가격은 10%, 수량은 5%로 서로 달라요. 1이 아니에요.'].slice(0,4),
  '가격 변화율 10%, 수량 변화율 5%라서 탄력성 = 5 ÷ 10 = 0.5(비탄력적)이에요. 총수입은 500×200 = 100,000원에서 550×190 = 104,500원으로 늘어요.','비탄력적일 땐 가격을 올리면 총수입↑, 내리면 ↓')},
/* 16 탄력성과 총수입(상품 고르기) */
{C:Q('다음은 네 가지 상품의 수요의 가격탄력성이다. 각 상품의 가격을 20% 인하했을 때 총수입(판매 수입)이 증가하는 상품만을 있는 대로 고른 것은?',
  ['가, 다','나, 라','가, 나','다, 라','가, 나, 다, 라'], 1,
  ['쌀(0.5), 소금(0.2)은 비탄력적이라 가격을 내리면 총수입이 줄어요.','쌀(0.5)은 비탄력적이라 가격 인하 시 총수입이 줄어요.','소금(0.2)은 비탄력적이라 가격 인하 시 총수입이 줄어요.','쌀, 소금은 비탄력적이라 빼야 해요.'].slice(0,0).concat(['쌀(0.5), 소금(0.2)은 비탄력적이라 가격을 내리면 총수입이 줄어요.','쌀(0.5)은 비탄력적이라 가격 인하 시 총수입이 줄어요.','소금(0.2)은 비탄력적이라 가격 인하 시 총수입이 줄어요.','쌀, 소금은 비탄력적이라 빼야 해요.']),
  '탄력성이 1보다 큰(탄력적인) 상품은 가격을 내리면 판매량이 크게 늘어 총수입이 늘어요. 영화 관람(1.3)과 해외여행(2.2)이 해당돼요.','가격을 내려서 이득을 보는 건 탄력성이 1보다 큰 상품!',
  {table:{head:['구분','가. 쌀','나. 영화 관람','다. 소금','라. 해외여행'], rows:[['탄력성','0.5','1.3','0.2','2.2']]}}),
 D:Q('다음은 네 가지 상품의 수요의 가격탄력성이다. 각 상품의 가격을 10% 인상했을 때 총수입(판매 수입)이 증가하는 상품만을 있는 대로 고른 것은?',
  ['나, 라','가, 다','가, 나','다, 라','가, 나, 다'], 1,

  '탄력성이 1보다 작은(비탄력적인) 상품은 가격을 올려도 판매량이 조금만 줄어 총수입이 늘어요. 병원 진료(0.3)와 수돗물(0.2)이 해당돼요.','가격을 올려서 이득을 보는 건 탄력성이 1보다 작은 상품!',
  {table:{head:['구분','가. 병원 진료','나. 명품 가방','다. 수돗물','라. 외식'], rows:[['탄력성','0.3','1.8','0.2','1.4']]}})},
/* 17 최저가격제 */
{C:Q('다음은 우유 시장의 가격에 따른 수요량과 공급량이다. 정부가 우유 농가를 보호하기 위해 우유 가격을 L당 2,500원 아래로 내려가지 못하도록 최저가격제를 실시하였다. 이때 시장에서 나타나는 현상으로 옳은 것은?',
  ['초과수요 30개가 발생한다.','초과수요 15개가 발생한다.','초과공급 30개가 발생한다.','초과공급 15개가 발생한다.','시장균형이 그대로 유지된다.'], 2,
  ['2,500원에서는 수요 35, 공급 65로 공급이 더 많아요. 초과“공급”이에요.','공급이 더 많으니 초과공급이고, 차이는 15가 아니라 30이에요.','초과공급은 맞지만 차이는 65 − 35 = 30이에요.','균형가격(2,000원)보다 높은 가격을 강제했으니 균형이 깨져요.'].reduce((a,x)=>{a.push(x);return a;},[]),
  '최저가격 2,500원에서 사려는 양은 35개, 팔려는 양은 65개예요. 남는 30개가 초과공급이에요.','최저가격제(균형보다 높게) → 초과공급 / 최고가격제(균형보다 낮게) → 초과수요',
  {table:{head:['가격(원/L)','1,000','1,500','2,000','2,500','3,000'], rows:[['수요량(개)','80','65','50','35','20'],['공급량(개)','20','35','50','65','80']]}}),
 D:Q('정부가 농산물의 최저가격을 균형가격보다 높게 정했을 때 나타나는 현상으로 가장 적절한 것은?',
  ['공급량이 수요량보다 많아 팔리지 않는 농산물이 생긴다.','수요량이 공급량보다 많아 농산물이 부족해진다.','시장균형이 그대로 유지된다.','농산물 가격이 균형가격보다 낮아진다.','소비자의 수요량이 늘어난다.'], 0,
  ['균형보다 높은 가격에서는 수요량이 줄고 공급량이 늘어서 물건이 남아요. 부족이 아니에요.','균형보다 높은 가격을 강제했으니 균형이 깨져요.','최저가격은 균형보다 “높게” 정한 거예요.','가격이 높아지면 수요량은 줄어요.'],
  '균형보다 높은 가격에서는 사려는 양(수요량)은 줄고 팔려는 양(공급량)은 늘어서 초과공급이 생겨요.','균형보다 “높게” 묶으면 → 초과공급(남음)')},
/* 18 최고가격제 */
{C:Q('정부가 마스크 가격 폭등을 막기 위해 마스크의 최고가격을 균형가격보다 낮게 정했다. 이때 나타날 수 있는 현상으로 가장 적절한 것은?',
  ['마스크를 사려는 사람이 팔려는 양보다 많아져 약국 앞에 긴 줄이 생긴다.','마스크가 팔리지 않고 남는다.','마스크 공급량이 오히려 크게 늘어난다.','마스크 수요량이 줄어든다.','시장균형이 그대로 유지된다.'], 0,
  ['낮은 가격에서는 남는 게 아니라 부족한 초과수요가 생겨요.','가격이 낮아지면 팔려는 양(공급량)은 줄어요.','가격이 낮아지면 사려는 양(수요량)은 늘어요.','균형보다 낮은 가격을 강제했으니 균형이 깨져요.'],
  '균형보다 낮은 최고가격에서는 사려는 양은 늘고 팔려는 양은 줄어 초과수요가 생겨요. 그래서 줄을 서게 돼요.','균형보다 “낮게” 묶으면 → 초과수요(부족)'),
 D:Q('다음 중 최고가격제에 대한 설명으로 옳은 것은?',
  ['균형가격보다 높은 수준에서 정해야 효과가 있다.','균형가격보다 낮은 수준에서 정하면 초과수요가 발생한다.','균형가격보다 낮은 수준에서 정하면 초과공급이 발생한다.','균형가격보다 높은 수준에서 정하면 초과수요가 발생한다.','최고가격은 시장에 아무 영향을 주지 않는다.'], 1,
  ['균형보다 “높은” 최고가격은 효과가 없어요. 원래 가격이 그 아래에서 형성되기 때문이에요.','낮은 가격에서는 사려는 양이 많아 초과“수요”가 생겨요.','균형보다 높은 최고가격은 효과가 없어요. 초과수요도 생기지 않아요.','균형보다 낮게 정하면 시장에 큰 영향을 줘요.'],
  '최고가격을 균형가격보다 낮게 정하면 수요량은 늘고 공급량은 줄어 초과수요가 발생해요.','최고가격제는 균형보다 “낮을 때” 효과가 있어요')},

  ['공급자가 세금을 더 많이 부담한다.','소비자가 세금을 더 많이 부담한다.','세금은 모두 소비자가 부담한다.','세금은 아무도 부담하지 않는다.','항상 절반씩 부담한다.'], 0,

  '토지처럼 공급을 쉽게 바꿀 수 없는(비탄력적) 쪽이 세금을 더 많이 떠안아요.','피하기 어려운(비탄력적) 쪽이 세금을 더 부담!'),
 D:Q('담배처럼 중독성이 있어 가격이 올라도 소비자가 쉽게 끊기 어려운(수요가 비탄력적인) 상품에 세금이 부과되었다. 조세 부담에 대한 설명으로 가장 적절한 것은?\n(단, 공급은 수요보다 탄력적이다.)',
  ['소비자가 세금을 더 많이 부담한다.','생산자가 세금을 더 많이 부담한다.','생산자가 세금을 모두 부담한다.','아무도 세금을 부담하지 않는다.','소비자와 생산자가 항상 절반씩 부담한다.'], 0,
  ['수요가 비탄력적이라 소비자는 값이 올라도 사야 해서 소비자가 더 부담해요. 생산자가 아니에요.','생산자가 전부 부담하는 경우는 거의 없어요. 소비자도 가격 상승으로 부담해요.','세금은 누군가 반드시 부담해요.','부담은 탄력성에 따라 달라져요. 항상 반반이 아니에요.'].slice(0,0).concat(['수요가 비탄력적이라 소비자는 값이 올라도 사야 해서 소비자가 더 부담해요. 생산자가 아니에요.','생산자가 전부 부담하는 경우는 거의 없어요. 소비자도 가격 상승으로 부담해요.','세금은 누군가 반드시 부담해요.','부담은 탄력성에 따라 달라져요. 항상 반반이 아니에요.']),
  '수요가 비탄력적이면 소비자가 가격이 올라도 사야 하니, 세금이 가격에 얹혀 소비자가 더 많이 부담해요.','피하기 어려운(비탄력적) 쪽이 세금을 더 부담!')},
/* 20 외부효과의 종류 */
{C:Q('다음 (가), (나) 사례에 대한 설명으로 옳은 것은?',
  ['(가) 부정적 외부효과 · 과다 생산\n(나) 긍정적 외부효과 · 과소 생산','(가) 긍정적 외부효과 · 과다 생산\n(나) 부정적 외부효과 · 과소 생산','(가) 긍정적 외부효과 · 과소 생산\n(나) 부정적 외부효과 · 과다 생산','(가) 긍정적 외부효과 · 과소 생산\n(나) 부정적 외부효과 · 과소 생산','(가) 부정적 외부효과 · 과소 생산\n(나) 긍정적 외부효과 · 과다 생산'], 2,
  ['(가)는 이익을 주니 긍정적, (나)는 피해를 주니 부정적이에요. 이름부터 반대예요.','(가)는 과소, (나)는 과다예요. 둘 다 반대로 골랐어요.','(가)는 맞아요! 그런데 (나)는 피해를 주고도 비용을 안 내니 “과다” 생산돼요.','(가)는 이익을 주니 긍정적이고, (나)는 피해를 주니 부정적이에요. 둘 다 반대예요.'],
  '꿀벌이 주변 과수원에 이익을 주는 (가)는 긍정적 외부효과(시장에 맡기면 과소), 폐수로 피해를 주는 (나)는 부정적 외부효과(시장에 맡기면 과다)예요.','이익을 주면 “모자라고”, 피해를 주면 “넘쳐요”',
  {box:['(가) 양봉 농가가 꿀벌을 키워 주변 과수원의 열매 맺기가 좋아졌다.','(나) 하천 상류의 공장이 폐수를 내보내 하류 어민이 피해를 입지만, 공장은 비용을 내지 않는다.']}),
 D:Q('다음 중 부정적 외부효과에 해당하는 것만을 있는 대로 고른 것은?',
  ['ㄱ, ㄷ','ㄴ, ㄹ','ㄱ, ㄴ','ㄷ, ㄹ','ㄱ, ㄴ, ㄷ'], 0,
  ['ㄴ, ㄹ은 남에게 이익을 주는 긍정적 외부효과예요.','ㄴ(꽃밭)은 이익을 주는 긍정적 외부효과예요.','ㄹ(교육)은 사회에 이익을 주는 긍정적 외부효과예요.','ㄴ(꽃밭)은 긍정적 외부효과라 빼야 해요.'],
  '소음(ㄱ), 간접흡연(ㄷ)처럼 남에게 피해를 주고 대가를 내지 않으면 부정적 외부효과예요.','피해를 주면 부정적, 이익을 주면 긍정적',
  {box:['ㄱ. 이웃집의 공사 소음','ㄴ. 친구가 가꾼 꽃밭 덕분에 즐거워진 산책','ㄷ. 담배 연기로 인한 간접흡연 피해','ㄹ. 교육 수준 향상으로 사회 전체의 생산성이 높아짐']})},
/* 21 사적 편익·사회적 편익 */
{C:Q('교육은 교육받은 사람뿐 아니라 사회 전체에도 이익을 준다. 교육을 개인의 선택에만 맡길 때의 설명으로 가장 적절한 것은?',
  ['사적 편익이 사회적 편익보다 작아 사회에 필요한 수준보다 교육이 적게 이루어진다.','사적 편익이 사회적 편익보다 커서 교육이 과다하게 이루어진다.','사적 비용이 사회적 비용보다 작아 교육이 과다하게 이루어진다.','사적 편익과 사회적 편익이 같아 적절하게 이루어진다.','교육은 외부효과가 없어 시장에 맡기는 것이 최선이다.'], 0,
  ['사회 전체가 얻는 이익이 더 커요. 사적 편익이 더 큰 게 아니에요.','이 사례는 비용이 아니라 편익 문제이고, 결과도 과소예요.','사회에도 이익이 가서 사회적 편익이 더 커요. 같지 않아요.','교육은 대표적인 긍정적 외부효과예요.'],
  '개인이 얻는 이익(사적 편익)만 따지면, 사회 전체가 얻는 이익(사회적 편익)보다 작아서 교육이 적게 이루어져요(과소).','사적 편익 < 사회적 편익 → 과소'),
 D:Q('다음 중 사적 비용이 사회적 비용보다 작아 시장에 맡기면 과다 생산되는 경우는?',
  ['하천을 오염시키는 공장의 제품 생산','독감 예방접종','도서관 이용','꽃밭 가꾸기','공공도서관 건립'], 0,
  ['예방접종은 사적 편익이 사회적 편익보다 작아 과소 이루어져요.','도서관 이용은 긍정적 외부효과라 과소 이용돼요.','꽃밭은 남에게 이익을 줘서 과소 공급돼요.','공공도서관은 이익이 크지만 시장에 맡기면 과소 공급돼요.'],
  '공장은 오염 피해(외부 비용)를 계산하지 않아 사적 비용이 사회적 비용보다 작고, 그래서 과다 생산돼요.','사적 비용 < 사회적 비용 → 과다')},
/* 22 외부효과 해결 정책 */
{C:Q('다음 (가), (나) 문제를 해결하기 위한 정부 정책으로 가장 적절한 것은?',
  ['(가) 배출 부담금 부과\n(나) 독서 지원 보조금 지급','(가) 보조금 지급\n(나) 독서세 부과','(가) 부담금 부과\n(나) 독서세 부과','(가) 보조금 지급\n(나) 보조금 지급','(가) 가격상한제 실시\n(나) 가격하한제 실시'], 0,
  ['반대로 했어요. 오염에 보조금을 주면 오염이 늘고, 독서에 세금을 매기면 독서가 줄어요.','(가)는 맞아요! 그런데 독서에 세금을 매기면 독서량이 더 줄어요.','(나)는 맞아요! 그런데 (가)에 보조금을 주면 배출을 늘려요.','가격상한·하한제는 외부효과를 직접 바로잡는 정책이 아니에요.'],
  '피해를 주는 쪽(미세먼지)에는 부담금으로 줄이고, 이익을 주는 쪽(독서)에는 보조금으로 늘려요.','피해 주면 세금, 이익 주면 보조금',
  {box:['(가) 자동차 배기가스로 인한 미세먼지가 심각하다.','(나) 학생들의 독서량이 사회에 필요한 수준보다 적다.']}),
 D:Q('다음 중 외부효과를 해결하기 위한 정책으로 적절하지 않은 것은?',
  ['오염 물질을 배출하는 기업에 부담금을 부과한다.','백신 접종에 보조금을 지급한다.','흡연 피해를 줄이기 위해 담배에 세금을 부과한다.','연구·개발(R&D)에 보조금을 지급한다.','오염 물질을 많이 배출하는 기업에 보조금을 지급한다.'], 4,
  ['적절한 정책이에요. 부정적 외부효과는 부담금으로 줄여요. “적절하지 않은 것”을 골라야 해요.','적절한 정책이에요. 긍정적 외부효과는 보조금으로 늘려요.','적절한 정책이에요. 피해를 주는 상품에는 세금을 매겨요.','적절한 정책이에요. R&D는 사회에 이익을 주는 긍정적 외부효과가 커요.'],
  '오염 기업에 보조금을 주면 오염을 오히려 늘려요. 부정적 외부효과는 세금·부담금, 긍정적 외부효과는 보조금이에요.','피해 주면 세금, 이익 주면 보조금')},
/* 23 공공재 */
{C:Q('다음 중 공공재의 성격(비배제성, 비경합성)을 모두 가진 것은?',
  ['등대','유료 주차장','공연장 좌석','편의점 샌드위치','사설 헬스장'], 0,
  ['유료 주차장은 요금을 안 내면 막을 수 있고(배제성), 한 대가 쓰면 다른 차가 못 써요(경합성).','공연장 좌석은 한 사람이 앉으면 다른 사람이 못 앉아요(경합성).','샌드위치는 돈을 내야 하고, 하나를 먹으면 남이 못 먹어요.','헬스장은 회원만 이용할 수 있어요(배제성).'],
  '등대는 한 배가 불빛을 쓴다고 다른 배의 이용이 줄지 않고(비경합성), 요금을 안 낸 배도 막기 어려워요(비배제성).','돈 안 내도 못 막고, 같이 써도 안 줄면 공공재'),
 D:Q('다음 중 공공재만을 있는 대로 고른 것은?',
  ['ㄱ, ㄷ','ㄱ, ㄴ','ㄴ, ㄹ','ㄷ, ㄹ','ㄱ, ㄴ, ㄷ'], 0,
  ['ㄴ 햄버거는 돈을 내야 먹을 수 있고, 내가 먹으면 남이 못 먹어요. 공공재가 아니에요.','햄버거와 영화관 관람은 돈을 내야 이용하는 사적 재화예요.','ㄹ 영화관 관람은 표가 없으면 막을 수 있어 공공재가 아니에요.','ㄴ 햄버거는 사적 재화예요. 빼야 해요.'],
  '경찰 서비스와 일기예보는 돈을 안 낸 사람도 막기 어렵고(비배제성), 여럿이 같이 써도 줄지 않아요(비경합성).','돈 안 내도 못 막고, 같이 써도 안 줄면 공공재',
  {box:['ㄱ. 경찰 서비스','ㄴ. 햄버거','ㄷ. 일기예보','ㄹ. 영화관 관람']})},
/* 24 무임승차 */
{C:Q('마을 주민들이 돈을 모아 방범 CCTV를 설치하려는데, 일부 주민은 “내가 안 내도 CCTV가 있으면 나도 안전하니까.”라며 모금에 참여하지 않는다. 이 주민의 행동을 가리키는 용어는?',
  ['무임승차','매몰비용','기회비용','부정적 외부효과','가격 차별'], 0,
  ['매몰비용은 이미 써서 못 돌려받는 비용이에요.','기회비용은 선택하며 포기한 것의 가치예요.','외부효과는 거래와 상관없이 남에게 영향을 주는 거예요. 이 행동 자체의 이름은 아니에요.','가격 차별은 같은 상품에 다른 가격을 매기는 거예요.'],
  '비용은 내지 않으면서 혜택만 누리려는 행동이 무임승차예요.','공짜로 “탑승”하는 느낌 = 무임승차'),
 D:Q('다음 중 무임승차 문제 때문에 시장에 맡기면 충분히 공급되기 어려운 것은?',
  ['국방 서비스','치킨','스마트폰','운동화','카페 음료'], 0,
  ['치킨은 돈을 낸 사람만 먹을 수 있어서 무임승차 문제가 거의 없어요.','스마트폰은 돈을 내야 쓸 수 있어요.','운동화는 돈을 낸 사람만 신을 수 있어요.','카페 음료도 돈을 낸 사람만 마실 수 있어요.'],
  '국방은 비용을 안 낸 사람도 혜택을 받아서 무임승차가 생겨요. 그래서 정부가 세금으로 공급해요.','돈을 안 내도 혜택을 받으면 → 무임승차 문제')},
/* 25 GDP의 개념 */
{C:Q('GDP 계산에서 “최종 생산물만” 계산하는 이유로 가장 적절한 것은?',
  ['중간재까지 모두 더하면 같은 가치가 여러 번 계산되기 때문이다.','중간재는 가치가 없기 때문이다.','최종 생산물만 국내에서 생산되기 때문이다.','정부가 중간재 거래를 금지했기 때문이다.','최종 생산물만 시장에서 거래되기 때문이다.'], 0,
  ['중간재도 가치가 있어요. 다만 최종 생산물 가격에 이미 포함돼 있어요.','중간재도 국내에서 생산될 수 있어요.','정부의 금지와는 상관없어요.','중간재도 시장에서 거래돼요. 이중 계산을 피하려는 거예요.'],
  '밀 → 밀가루 → 빵을 모두 더하면 밀의 가치가 여러 번 들어가요. 그래서 최종 생산물(빵)만 계산해요.','이중 계산 방지!'),
 D:Q('다음 중 GDP에 대한 설명으로 옳지 않은 것은?',
  ['일정 기간에 생산된 가치를 측정한다.','국내에서 생산된 것이면 외국 기업이 생산한 것도 포함한다.','시장에서 거래되는 재화와 서비스를 주로 계산한다.','가정에서 가족이 하는 무급 가사노동도 포함한다.','최종 생산물의 가치를 합한 것이다.'], 3,
  ['옳은 설명이에요. GDP는 일정 기간 동안의 생산을 재요. “옳지 않은 것”을 골라야 해요.','옳은 설명이에요. 국내 생산이면 국적과 관계없이 포함돼요.','옳은 설명이에요. 시장 거래를 기준으로 해요.','옳은 설명이에요. 최종 생산물만 합해요.'],
  '무급 가사노동은 시장에서 거래되지 않아 GDP에 포함되지 않아요.','시장에서 거래되지 않으면 GDP에서 빠져요')},
/* 26 GDP에 포함되는 것 */
{C:Q('다음 중 올해 우리나라의 GDP에 포함되는 것만을 있는 대로 고른 것은?\n(단, 모든 거래와 생산은 올해 이루어진 것이다.)',
  ['ㄴ, ㄷ, ㅁ','ㄱ, ㄷ, ㅁ','ㄱ, ㅁ, ㅂ','ㄱ, ㄷ, ㄹ','ㄷ, ㄹ, ㅂ'], 1,
  ['ㄴ(중고 노트북 대금)은 새로 생산된 게 아니라 제외돼요. 그리고 ㄱ이 빠졌어요.','','ㅂ(해외 공장 생산)은 국내 생산이 아니라 제외돼요. 그리고 ㄷ이 빠졌어요.','ㄹ(가사노동)은 시장 거래가 없어 제외돼요. 그리고 ㅁ이 빠졌어요.','ㄹ, ㅂ은 제외 대상이에요. 그리고 ㄱ이 빠졌어요.'].filter(Boolean),
  '국내에서 올해 새로 생산되어 시장에서 거래되면 포함이에요. ㄱ 스마트폰, ㄷ 이발 서비스, ㅁ 외국 회사의 국내 생산은 포함돼요.','GDP는 국적이 아니라 “국내 영토” 기준!',

/* ---------- 저장소 (막히면 메모리로 대체) ---------- */
const mem = {};
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return (k in mem) ? mem[k] : d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ mem[k] = v; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; } }
};
const K_NAME = 'econ2_name', K_RUN = 'econ2_run', K_LAST = 'econ2_last';

const app = document.getElementById('app');
const DAYS = ['일','월','화','수','목','금','토'];
const N = BANK.length;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2,'0');
const fmtDate = d => d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate())+' ('+DAYS[d.getDay()]+')';
const fmtTime = d => pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
const fmtDur = ms => { const s = Math.round(ms/1000); return Math.floor(s/60)+'분 '+pad(s%60)+'초'; };
function hash4(str){ let h = 2166136261; for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619); } return (h>>>0).toString(36).toUpperCase().padStart(4,'0').slice(-4); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
const range = n => Array.from({length:n}, (_,i)=>i);

let name = store.get(K_NAME, '');
let cur = null, t0 = 0, clockTimer = null;

/* ---------- 효과 ---------- */
const RM = (typeof matchMedia === 'function') && matchMedia('(prefers-reduced-motion: reduce)').matches;
function fxLayer(){ let l = document.getElementById('fx'); if(!l){ l = document.createElement('div'); l.id = 'fx'; l.className = 'fx'; document.body.appendChild(l); } return l; }
function burst(x, y, opt){
  if(RM) return;
  try{
    const layer = fxLayer();
    const o = Object.assign({n:12, spread:70, size:8, fall:0, colors:['var(--ok)','var(--pri)'], dur:750}, opt || {});
    for(let i = 0; i < o.n; i++){
      const p = document.createElement('i'); p.className = 'fp';
      const w = o.size * (0.6 + Math.random()*0.8), h = Math.random() < .5 ? w : w*0.45;
      p.style.cssText = 'left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px;background:'+o.colors[i % o.colors.length]+';border-radius:'+(Math.random() < .4 ? '50%' : '2px');
      layer.appendChild(p);
      const a = Math.random()*Math.PI*2, d = o.spread*(0.4 + Math.random()*0.6);
      const dx = Math.cos(a)*d, dy = Math.sin(a)*d - o.spread*0.25, r = (Math.random() - .5)*540;
      const an = p.animate([
        {transform:'translate(0,0) scale(.4) rotate(0deg)', opacity:1},
        {transform:'translate('+dx+'px,'+dy+'px) scale(1) rotate('+(r*0.6)+'deg)', opacity:1, offset:.55},
        {transform:'translate('+(dx*1.1)+'px,'+(dy + o.fall)+'px) scale(.8) rotate('+r+'deg)', opacity:0}
      ], {duration:o.dur*(0.8 + Math.random()*0.5), easing:'cubic-bezier(.16,.7,.3,1)', fill:'forwards'});
      an.onfinish = () => p.remove();
    }
  }catch(e){}
}
function celebrate(){
  if(RM) return;
  try{
    const w = innerWidth, h = innerHeight, cols = ['var(--pri)','var(--ok)','#F59E0B','#EC4899','#3B82F6'];
    [[.18,.38],[.5,.3],[.82,.38]].forEach((pt,i) => setTimeout(() => burst(w*pt[0], h*pt[1], {n:28, spread:150, size:10, fall:280, colors:cols, dur:1500}), 250 + i*180));
  }catch(e){}
}

/* ---------- 진행 상태 ---------- */
function getRun(){ const r = store.get(K_RUN, null); return (r && r.v === 2 && Array.isArray(r.queue)) ? r : null; }
function setRun(r){ r ? store.set(K_RUN, r) : store.del(K_RUN); }
const masteredCount = run => Object.keys(run.mastered).length;
const VERS = ['A','B','C','D'];
const pickQ = (run, cid) => BANK[cid][VERS[((run.attempts[cid] || 0) + (run.ver ? run.ver[cid] : 0)) % VERS.length]];   // 시작 버전은 학생마다 랜덤, 틀릴 때마다 다른 버전
function stopClock(){ if(clockTimer){ clearInterval(clockTimer); clockTimer = null; } }

function startRun(){
  const run = {v:2, name, round:1, queue:shuffle(range(N)), ver:range(N).map(() => Math.floor(Math.random() * VERS.length)), i:0, mastered:{}, attempts:{}, first:{}, wrongCnt:{}, wrong:[], rounds:[], intro:null, ms:0, tries:0, startedAt:Date.now()};
  setRun(run);
  showQuestion();
}

/* ---------- 화면: 시작(표지) ---------- */

  stopClock(); cur = null;
  const run = getRun();
  const last = store.get(K_LAST, null);

/* ---------- 화면: 문제 ---------- */
function goNext(){
  const w = document.querySelector('.qwrap');
  if(!w || RM){ advance(); return; }
  w.classList.add('leave');
  setTimeout(advance, 210);
}
function advance(){
  const run = getRun(); if(!run) return home();
  run.i++; setRun(run);
  if(run.i >= run.queue.length) return endRound(run);
  showQuestion();
}

function showQuestion(){
  stopClock();
  const run = getRun();
  if(!run) return home();
  if(run.intro) return showIntro(run);
  if(run.i >= run.queue.length) return endRound(run);
  const cid = run.queue[run.i], b = BANK[cid], q = pickQ(run, cid);
  const order = shuffle(range(q.c.length));
  cur = {cid, q, order, answered:false};
  t0 = Date.now();
  const total = run.queue.length, pct = Math.round(run.i / total * 100);
  const box = q.box ? `<div class="box${q.box.every(x=>/^※/.test(x)) ? ' plain' : ''}">${q.box.map(l=>`<div>${esc(l)}</div>`).join('')}</div>` : '';
  const table = q.table ? `<div class="tblwrap"><table class="tbl"><thead><tr>${q.table.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${q.table.rows.map(r=>`<tr>${r.map((c,ci)=>ci?`<td>${esc(c)}</td>`:`<th>${esc(c)}</th>`).join('')}</tr>`).join('')}</tbody></table></div>` : '';
  const choices = order.map((oi,pos) => `<button class="choice" data-pos="${pos}"><span class="k">${NUM[pos]}</span><span class="tx">${esc(q.c[oi])}</span></button>`).join('');
  const label = run.round === 1 ? '1라운드 · 전체 풀이' : run.round+'라운드 · 다시 도전';
  app.innerHTML = `
    <div class="qwrap">
      <div class="top"><button class="link" id="pause">처음으로</button><span class="chip ${run.round>1?'r':''}">${label}</span><span class="chip">${esc(SEC[b.s])}</span></div>
      <div class="mast"><span>정복한 개념 <b id="mc">${masteredCount(run)}</b> / ${N}</span><span class="count">${run.i+1}<small> / ${total}</small></span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="card">
        <span class="qno">${run.round===1 ? '문제 '+(run.i+1) : '다시 도전 '+(run.i+1)} · ${esc(b.t)}</span>
        <h2 class="q">${esc(q.q)}</h2>
        ${box}${table}
        <div class="choices">${choices}</div>
        <div id="fb" aria-live="polite"></div>
      </div>
    </div>`;
  document.getElementById('pause').onclick = home;
  app.querySelectorAll('.choice').forEach(b => b.onclick = () => answer(+b.dataset.pos));
  if(window.scrollTo) window.scrollTo(0, 0);
}

const SOFT = ['괜찮아요! 이 문제는 많이 헷갈려요 😊','아쉬워요. 하지만 지금 알게 된 게 더 중요해요 💪','틀려도 괜찮아요. 해설을 한 번만 읽어 볼까요? 📖','좋은 시도였어요! 같이 짚어 봐요 🔍'];

function answer(pos){
  if(!cur || cur.answered) return;
  cur.answered = true;
  const run = getRun(); if(!run) return;
  const {q, order, cid} = cur;
  const chosen = order[pos], right = chosen === q.a;
  run.ms += Math.min(Date.now() - t0, 180000);
  run.tries++;
  if(run.first[cid] === undefined) run.first[cid] = right ? 1 : 0;
  run.attempts[cid] = (run.attempts[cid] || 0) + 1;
  if(right){ run.mastered[cid] = 1; }
  else { run.wrong.push(cid); run.wrongCnt[cid] = (run.wrongCnt[cid] || 0) + 1; }
  setRun(run);

  const btns = app.querySelectorAll('.choice');
  btns.forEach((b,i) => {
    b.disabled = true;
    const k = b.querySelector('.k');
    if(i === pos){ b.classList.add('picked', right ? 'ok' : 'bad'); if(k) k.textContent = right ? '✓' : '✕'; }
    else if(order[i] === q.a){ b.classList.add('ok','late'); if(k) k.textContent = '✓'; }
    else b.classList.add('dim');
  });
  const mc = document.getElementById('mc'); if(mc) mc.textContent = masteredCount(run);
  if(right){
    const pk = btns[pos], t = pk && (pk.querySelector('.k') || pk);
    if(t){ const r = t.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/2, {n:14, spread:75, size:8}); }
  }
  const lastQ = run.i >= run.queue.length - 1;
  const ansPos = order.indexOf(q.a);
  let html;
  if(right){
    html = `<div class="fb ok" role="status"><b>정답이에요! 🎉</b><p>${esc(q.e)}</p><div class="part tip"><i>💡 기억 꿀팁</i><p>${esc(q.tip)}</p></div></div>`;
  } else {
    html = `<div class="fb bad" role="status"><b>${SOFT[run.tries % SOFT.length]}</b>
      <div class="part"><i>① 내가 고른 답은 왜 아닐까요?</i><p>${NUM[pos]} ${esc(q.c[chosen]).replace(/\n/g,' ')}<br><br>${esc(q.w[chosen] || '이 보기는 정답이 아니에요.')}</p></div>
      <div class="part"><i>② 정답은 이거예요</i><p><b class="ans">정답: ${NUM[ansPos]} ${esc(q.c[q.a]).replace(/\n/g,' ')}</b>${esc(q.e)}</p></div>
      <div class="part tip"><i>③ 💡 기억 꿀팁</i><p>${esc(q.tip)}</p></div>
      <div class="again">이 개념은 다음 라운드에서 <b>비슷한 새 문제</b>로 다시 나와요. 방금 해설을 기억해 두세요!</div></div>`;
  }
  const lbl = lastQ ? (run.wrong.length ? '라운드 결과 보기' : '결과 보기') : '다음 문제';
  document.getElementById('fb').innerHTML = html + `<button class="btn wide nx" id="next">${lbl}</button>`;
  const nb = document.getElementById('next');
  nb.onclick = goNext;
  nb.focus({preventScroll:true});
  if(nb.scrollIntoView) nb.scrollIntoView({block:'nearest', behavior: RM ? 'auto' : 'smooth'});
}

/* 키보드: 1~5 보기 선택 */
document.addEventListener('keydown', e => {
  if(!cur || e.ctrlKey || e.metaKey || e.altKey) return;
  if(document.activeElement && document.activeElement.tagName === 'INPUT') return;
  if(!cur.answered && /^[1-5]$/.test(e.key)){
    const n = +e.key - 1;
    if(app.querySelectorAll('.choice')[n]) answer(n);
  }
});

/* ---------- 라운드 종료 / 안내 ---------- */
function endRound(run){
  const total = run.queue.length, wrongN = run.wrong.length;
  run.rounds.push({r:run.round, total, wrong:wrongN});
  if(wrongN === 0){ setRun(run); return finish(run); }
  run.intro = {r:run.round, total, correct:total - wrongN, wrong:run.wrong.slice()};
  setRun(run);
  showIntro(run);
}

function showIntro(run){
  stopClock(); cur = null;
  const it = run.intro;
  const m = masteredCount(run);
  const tags = it.wrong.map(c => `<span class="tag">${esc(BANK[c].t)}</span>`).join('');
  app.innerHTML = `
    <div class="cert">
      <svg class="chk" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="23"/><path d="M15 27l8 8 15-16"/></svg>
      <div class="h">${it.r}라운드 끝!</div>
      <div class="name">${it.correct} / ${it.total}</div>
      <div class="msg">${it.r===1 ? '첫 도전 정답' : '이번 라운드 정답'} · 아직 못 맞힌 개념 <b>${it.wrong.length}개</b>가 남았어요</div>
      <div style="text-align:left;margin-top:6px">
        <div class="mast"><span>정복한 개념</span><b>${m} / ${N}</b></div>
        <div class="mbar"><i style="width:${Math.round(m/N*100)}%"></i></div>
      </div>
    </div>
    <div class="sec rise" style="--i:1">
      <h2>다시 도전할 개념 (${it.wrong.length}개)</h2>
      <div class="tags">${tags}</div>
      <p class="sub" style="margin:12px 0 0;font-size:.9rem">같은 개념을 <b>조금 다른 문제</b>로 물어봐요. 방금 본 해설을 떠올리며 풀어 보세요. 30개 개념을 모두 맞히면 끝나요!</p>
    </div>
    <div class="actions rise" style="--i:2">
      <button class="btn acc" id="go">${it.wrong.length}문제 다시 도전하기</button>
      <button class="btn line" id="home">처음 화면으로</button>
    </div>`;
  document.getElementById('home').onclick = home;
  document.getElementById('go').onclick = () => {
    const r = getRun(); if(!r) return home();
    r.round++; r.queue = shuffle(r.intro.wrong); r.i = 0; r.wrong = []; r.intro = null;
    setRun(r); showQuestion();
  };
  if(window.scrollTo) window.scrollTo(0, 0);
  if(it.correct / it.total >= .7) celebrate();
}

/* ---------- 완료 / 결과 ---------- */
function finish(run){
  const firstOk = range(N).filter(c => run.first[c] === 1).length;
  const sec = SEC.map((_, si) => {
    const ids = range(N).filter(c => BANK[c].s === si);
    return {n:SEC[si], ok:ids.filter(c => run.first[c] === 1).length, total:ids.length};
  });
  const hard = range(N).filter(c => (run.wrongCnt[c] || 0) > 0).sort((a,b) => (run.wrongCnt[b]||0) - (run.wrongCnt[a]||0)).map(c => ({t:BANK[c].t, n:run.wrongCnt[c]}));
  const rec = {name:run.name, ms:run.ms, firstOk, total:N, rounds:run.rounds.length, tries:run.tries, sec, hard, at:Date.now()};
  rec.code = hash4(rec.name+'|'+rec.firstOk+'|'+rec.rounds+'|'+rec.at);
  store.set(K_LAST, rec);
  setRun(null);
  result(rec, true);
}

function msgFor(rec){
  if(rec.rounds === 1) return '한 번에 30문제 모두 정복! 대단해요 🏆';
  if(rec.firstOk >= 24) return '거의 다 맞혔고, 남은 개념도 모두 정복했어요 👏';
  if(rec.firstOk >= 15) return '틀린 개념을 끝까지 다시 풀어 모두 정복했어요 👍';
  return '끝까지 포기하지 않고 30개 개념을 모두 정복했어요 💪';
}

function result(rec, fresh){
  stopClock(); cur = null;
  const at = new Date(rec.at);
  const secHtml = `<div class="sec rise" style="--i:1"><h2>단원별 첫 도전 결과</h2>` + rec.sec.map(s => {
    const p = s.total ? Math.round(s.ok/s.total*100) : 0;
    return `<div class="row"><span>${esc(s.n)}</span><span class="tr"><i class="${s.ok===s.total?'full':''}" style="width:${p}%"></i></span><b>${s.ok}/${s.total}</b></div>`;
  }).join('') + `</div>`;
  const hardHtml = rec.hard.length
    ? `<div class="sec rise" style="--i:2"><h2>한 번 더 복습하면 좋은 개념</h2><div class="tags">${rec.hard.map(h => `<span class="tag">${esc(h.t)}${h.n>1?' ×'+h.n:''}</span>`).join('')}</div><p class="sub" style="margin:10px 0 0;font-size:.85rem">× 숫자는 틀린 횟수예요.</p></div>`
    : `<div class="sec rise center" style="--i:2"><div class="allok">🎉 틀린 개념이 하나도 없어요!</div></div>`;
  app.innerHTML = `
    <div class="cert">
      <svg class="chk" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="23"/><path d="M15 27l8 8 15-16"/></svg>
      <div class="h">진단평가 정복 완료</div>
      <div class="name">${esc(rec.name)}</div>
      <div class="msg">${msgFor(rec)}</div>
      <div class="score"><span id="sc">${rec.firstOk}</span><small> / ${rec.total}</small></div>
      <div class="cap">첫 도전 정답 · 최종 정복 ${rec.total} / ${rec.total}</div>
      <div class="stats">
        <div><span>완료 일시</span><b>${fmtDate(at)}<br>${fmtTime(at)}</b></div>
        <div><span>소요 시간</span><b>${fmtDur(rec.ms)}</b></div>
        <div><span>라운드 수</span><b>${rec.rounds}라운드</b></div>
        <div><span>총 풀이 횟수</span><b>${rec.tries}문제</b></div>
        <div style="grid-column:1 / -1"><span>확인 코드</span><b>${esc(rec.code)}</b></div>
      </div>
      <div class="clock"><span><i class="dot"></i>현재 시각</span><b id="clk"></b><div class="d" id="cd"></div></div>
    </div>
    ${secHtml}
    ${hardHtml}
    <div class="actions rise" style="--i:3">
      <button class="btn" id="again">처음부터 다시 풀기</button>
      <button class="btn line" id="home">처음 화면으로</button>
    </div>`;
  const tick = () => { const n = new Date(); const c = document.getElementById('clk'), d = document.getElementById('cd'); if(c) c.textContent = fmtTime(n); if(d) d.textContent = fmtDate(n); };
  tick(); clockTimer = setInterval(tick, 1000);
  document.getElementById('home').onclick = home;
  document.getElementById('again').onclick = () => { name = rec.name; store.set(K_NAME, name); startRun(); };
  if(window.scrollTo) window.scrollTo(0, 0);
  const sc = document.getElementById('sc');
  if(sc && !RM && fresh && typeof requestAnimationFrame === 'function'){
    sc.textContent = '0';
    const st = performance.now(), dur = 1000;
    (function step(t){ const p = Math.min(1, (t - st) / dur); sc.textContent = Math.round(rec.firstOk * (1 - Math.pow(1 - p, 3))); if(p < 1) requestAnimationFrame(step); })(st);
  }
  if(fresh) celebrate();
}

/* ---------- 시작 ---------- */
home();
</script>
</body>
</html>
